   ${renderIvPaper(c, iv, staff, persons, photos)}
   <p class="muted noprint">※申述は入力された文言をそのまま出力しています（AIによる追加・変更はありません）。正式な様式は所属消防本部の様式と照合して確定します。【要確認】</p>`);
});

/* =========================================================
   様式3：出火出動時における見分調査書（出動した職員ごと）
   【マニュアル準拠】第4章・様式3。消防活動中に見分した事実を記録し、出火建物の判定等の資料とする
   ========================================================= */
M.dispInfoTypes = ["見分事実","計測結果","申述","写真・図面"];   // 関係者等の発言・応答は「申述」として区別する
M.dispSections = [
  ["a1","1⑴","覚知時の位置状況"],
  ["a2","1⑵","出動途上時の火煙、異臭、異音、爆発等の状況とその確認時の位置"],
  ["a3","1⑶","踏切の遮断、交通渋滞その他"],
  ["a4","1⑷","部署の位置"],
  ["b1","2⑴","下車後の行動"],
  ["b2","2⑵","出火建物、周囲建物の火煙の状況、延焼状況、屋根の燃え抜け、軒先、開口部からの火煙の噴出状況、火勢の強弱と確認時の位置"],
  ["b3","2⑶","隣棟等への延焼状況"],
  ["b4","2⑷","異臭、異音、爆発等の特異な現象と確認時の位置・確認事項"],
  ["b5","2⑸","関係者等の負傷、服装、行動の概要及び応答内容"],
  ["b6","2⑹","建物の出入口、窓、シャッター等の開閉、施錠状態"],
  ["b7","2⑺","消防用設備等の作動・使用状況"],
  ["b8","2⑻","焼損建物の構造"],
  ["b9","2⑼","その他必要な事項"],
  ["c1","3⑴","延焼拡大状況"],
  ["c2","3⑵","関係者等の発言・応答内容"],
  ["c3","3⑶","漏洩電流・ガス漏れの有無、ガス栓の開閉状況、その他火災原因判定に必要な事項"],
  ["c4","3⑷","防火戸の開閉・作動状況"],
  ["c5","3⑸","残火処理に伴う出火箇所付近の物件の移動、倒壊、損壊の状況"],
  ["c6","3⑹","避難状況及び救助・避難誘導状況"],
  ["c7","3⑺","死傷者の発見、救助の状況"],
  ["c8","3⑻","その他の必要な事項"]];
M.dispGroups = {"1":"出動途上における見分状況","2":"現場到着時における見分状況","3":"消防活動中における見分状況"};
const dispDefaultType = k => ["b5","c2"].includes(k) ? "申述" : "見分事実";
function dispLabel(d, staff){ const s = staff.find(x=>x.id===d.authorStaffId); return `出火出動時における見分調査書（${[d.unit, s?.name].filter(Boolean).join("　")||"作成者未設定"}）`; }
function newDispatchDoc(caseId, authorStaffId){
  const sections = {}; M.dispSections.forEach(([k])=>sections[k]=[]);
  return {id:uuid(), caseId, status:"作成中", version:0, docDate:new Date().toISOString().slice(0,10), authorStaffId:authorStaffId||"", unit:"", duty:"", sections, photoIds:[], drawNote:""};
}
function checkDispatch(d, c, others){
  const ck = []; const add=(lv,msg,src)=>ck.push({lv,msg,src});
  if (!d.authorStaffId) add(1,"作成者（出動した職員）が未設定です。","第4章第2節");
  if (!d.duty) add(2,"冒頭の「○○として消防活動に従事し」の部分（従事内容）が未入力です。例：第1消防隊の隊長","様式3");
  const paras = M.dispSections.flatMap(([k,no])=>(d.sections[k]||[]).map(p=>({...p, k, no}))).filter(p=>(p.text||"").trim());
  if (!paras.length) add(1,"見分した内容が入力されていません。","様式3");
  for (const p of paras){
    if (!p.k.startsWith("a") && p.infoType!=="申述" && !/(から|地点|点[）)]?|側|位置|付近|路上|前)/.test(p.text)) add(3,`${p.no}：見分した位置が書かれていないようです。原則として見分した位置を明示します。`,"第4章第3節■3⑷");
    if (/(た|だ)。\s*$/.test(p.text.trim()) && p.infoType!=="申述") add(3,`${p.no}：過去形の文末です。一般的には現在形で記載する運用がなされています。`,"第4章第3節■3⑶");
    if (p.infoType==="申述" && p.text.length>200) add(3,`${p.no}：関係者等の発言が長くなっています。詳細な聞き込みは質問調査書に記載します。`,"第4章第1節");
    if (["b5","c2"].includes(p.k) && p.infoType!=="申述") add(3,`${p.no}：関係者等の発言・応答の記録は情報区分を「申述」にすると、見分した事実と区別できます。【独自提案】`);
    const jt = M.judgeTerms.filter(t=>p.text.includes(t)); if (jt.length) add(3,`${p.no}：「${jt.join("」「")}」は判定に関わる用語です。見分した事実（例：①建物、北側の窓）として記載しているか確認してください。【独自提案】`,"第5章第3節■2（準用）");
  }
  if (c.extinguishedAt && d.docDate){ const days = (new Date(d.docDate+"T23:59:59") - new Date(c.extinguishedAt))/864e5; if (days>3) add(3,`鎮火から${Math.floor(days)}日後の作成です。帰署後、記憶が鮮明なうちに作成するよう努めます。【独自提案：3日を目安】`,"第4章第3節■3⑵"); }
  if (d.authorStaffId && others.some(x=>x.id!==d.id && x.authorStaffId===d.authorStaffId)) add(2,"同じ職員の出火出動時における見分調査書が複数あります。","様式3");
  return ck;
}
function renderDispPaper(c, d, staff, photos){
  const a = staff.find(s=>s.id===d.authorStaffId);
  let curG = ""; const body = M.dispSections.filter(([k])=>(d.sections[k]||[]).some(x=>(x.text||"").trim())).map(([k,no,title])=>{
    const g = no[0]; const head = g!==curG ? (curG = g, `<div class="sec"><div>${g}　${esc(M.dispGroups[g])}</div></div>`) : "";
    return `${head}<div style="padding-left:1em">${esc(no.slice(1))}　${esc(title)}</div>${d.sections[k].filter(x=>(x.text||"").trim()).map((x,i)=>`<div class="it">${KANA[i]||"・"}　${esc(x.text)}</div>`).join("")}`; }).join("");
  const ph = (d.photoIds||[]).map(id=>photos.find(p=>p.id===id)).filter(Boolean);
  return `<div class="paper"><div class="right">火災番号　${esc(c.fireNumber)}</div><h1 style="letter-spacing:.1em">出火出動時における見分調査書</h1>
   <p>火災番号${esc(c.fireNumber)}の火災について、${esc(d.duty||"〔従事内容〕")}として消防活動に従事し、次のとおり見分した。</p>
   <div class="right">${esc(d.docDate?fmtDate(d.docDate+"T00:00:00"):"")}<br>所属　${esc(a?.dept||"")}<br>階級・氏名　${esc(a?[a.rank,a.name].filter(Boolean).join("　"):"")}</div>
   ${body}
   ${ph.length||d.drawNote?`<div class="sec"><div>4　図面及び写真</div>${ph.map(p=>`<div class="it">・${esc(caption(p))}</div>`).join("")}${d.drawNote?`<div class="it">・${esc(d.drawNote)}</div>`:""}</div>`:""}</div>`;
}

  ${d.status==="訂正中"?`<div class="lock">訂正中（訂正理由：${esc(d.correctionReason)}）。再度「確定」すると新しい版になります。</div>`:""}
  <div class="card"><div class="grid">
   ${field("作成者（出動した職員）",`<select data-path="authorStaffId" ${dis}>${optObj(lstaff,d.authorStaffId,staffLabel)}</select>`,true)}
   ${field("作成日",inp("docDate","","","date"))}
   ${field("隊名（表題の区別用）",inp("unit","例：第1消防隊"))}
   ${field("従事内容（「○○として消防活動に従事し」）",inp("duty","例：第1消防隊の隊長"))}</div></div>
  <details class="card chkcard" ${checks.some(x=>x.lv===1)?"open":""}><summary><h3 style="display:inline">チェック結果（${checks.length}件）</h3><span class="muted">　${chkSum(checks)}</span></summary><p class="muted">修正を強制するものではありません。【仮仕様：3段階表示】</p>

/* =========================================================
   申述の比較（同じ項目の申述を申述者ごとに並べる・申述中の時刻を時系列に並べる）
   【マニュアル準拠】発見者・通報者・初期消火者等の一つの事象に対する申述が異なる場合は注意（第6章第3節■1⑵）
   【独自提案】時刻の抜き出しは文字の規則による。食い違いかどうかの判断は担当者が行う
   ========================================================= */
function extractTimes(text){
  const out = []; const z2h = s => s.replace(/[０-９]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
  const t = z2h(text||"");
  const re = /(午前|午後|朝|夕方|夜|深夜)?\s*(\d{1,2})\s*時\s*(?:(\d{1,2})\s*分|半)?\s*(頃|ごろ|過ぎ|前)?|(\d{1,2}):(\d{2})/g;
  let m; while ((m = re.exec(t))){
    let h, mi, word = m[0].trim();
    if (m[5]!==undefined){ h = +m[5]; mi = +m[6]; }
    else { h = +m[2]; mi = m[3]!==undefined ? +m[3] : (/半/.test(m[0]) ? 30 : 0); if ((m[1]==="午後"||m[1]==="夕方"||m[1]==="夜") && h<12) h += 12; }
    if (h>24 || mi>59) continue;
    out.push({h, mi, word, approx: /頃|ごろ|過ぎ|前|半/.test(m[0]) || m[3]===undefined, ambiguous: !m[1] && m[5]===undefined && h<=12});
  }
  return out;
}
const hm = iso => { const d = new Date(iso); return d.getHours()*60+d.getMinutes(); };

function checkDamage(d, persons){
  const ck = []; const add=(lv,msg,src)=>ck.push({lv,msg,src});
  if (!d.authorStaffId) add(1,"作成者が未設定です。");
  if (!d.place) add(1,"り災場所が未入力です。","様式6");
  if (!d.personId) add(2,"関係者等（所有者・占有者等）が選ばれていません。","様式6");
  else if (!d.kind) add(2,"関係者等の区分（所有・占有・管理・その他）が未選択です。","様式6");
  if (d.type==="建築物"){
    if (!d.bldg.degree) add(1,"焼損程度が未選択です。","様式6");
    if (!d.bldg.structure) add(2,"構造が未選択です。","様式6");
    if (["全焼","半焼","部分焼"].includes(d.bldg.degree) && !dmgFloorSum(d) && !num(d.surfaceArea)) add(2,`焼損程度が「${d.bldg.degree}」ですが、焼損床面積・焼損表面積が入力されていません。`,"第7章■3");
  } else if (d.type==="車両" && !d.veh.regNo) add(3,"登録番号（車両を特定できる番号）が未入力です。","第7章■2⑴");
  else if (["船舶","航空機"].includes(d.type) && !d.veh.name) add(3,"船名・機名が未入力です。","第7章■2⑵");
  if (!dmgTotal(d)) add(2,"損害額が入力されていません（損害がない場合も0円であることを確認してください）。","様式6");
  if (dmgTotal(d) && !d.calcAttached) add(3,"損害額をシステムや表計算で算定した場合は、算定根拠として損害算定書類を添付することが望ましいとされています。","第7章■4");
  if (["その他"].includes(d.type) && !d.notes) add(3,"林野・その他の物品は、品名・り災種別・数量・損害額を品名ごとに備考に記載します。","第7章■5");
  if ((d.main.water||d.cont.water) && !d.situation && !d.cont.situation) add(3,"消火損害がある場合は、損害状況等に消火損害の程度を記載します。","第7章■3⑵");
  return ck;
}
function checkCasualty(x, person){
  const ck = []; const add=(lv,msg,src)=>ck.push({lv,msg,src});
  if (!x.authorStaffId) add(1,"作成者が未設定です。");
  if (!person) add(1,"死傷者（関係者）が選ばれていません。","様式7");
  if (!x.kind) add(1,"死者か負傷者かが未選択です。","様式7");
  if (!x.occ) add(2,"発生区分が未選択です。","様式7");
  if (person && x.kind && !(person.roles||[]).includes(x.kind==="死者"?"死者":"負傷者")) add(3,`関係者の画面で「${x.kind==="死者"?"死者":"負傷者"}」の役割が設定されていません。`);
  const groups = x.kind==="死者" ? [...M.cas.dead.map(r=>["dead",r]), ...M.cas.course.map(r=>["dead",r])] : x.kind==="負傷者" ? M.cas.inj.map(r=>["inj",r]) : [];
  const otherSel = groups.filter(([s,[k]])=>Object.entries(x[s][k]||{}).some(([o,v])=>v && /その他/.test(o))).map(([,[,lab]])=>lab);
  if (otherSel.length && !x.notes) add(1,`「その他」を選んだ項目（${otherSel.join("・")}）があります。判明していることを特記事項に記入します。`,"第8章■2・■3");
  if (x.kind==="死者"){
    if (!Object.values(x.dead.cause||{}).some(Boolean)) add(2,"死因が未選択です。","様式7");
    if (!x.dead.place) add(2,"死者の発生場所が未入力です。","様式7");
    if (!x.dead.cls) add(2,"死者区分（48時間・30日死者）が未選択です。","様式7");
  }
  if (x.kind==="負傷者" && !x.inj.severity) add(2,"負傷程度が未選択です。","様式7");
  if (!x.basis) add(2,"状況の根拠（確認した事実か申述か等）が未選択です。確認できた内容と申述内容を区別します。【項目定義表 様式7】");
  return ck;
}

async function damageAgg(caseId){
  const latest = async (store) => { const out = []; let draft = 0;
    for (const d of live(await byIndex(store,"caseId",caseId))){ const rv = live(await byIndex("revisions","docId",d.id)).sort((a,b)=>b.version-a.version)[0]; if (rv) out.push(rv.snapshot.doc); else draft++; }
    return {docs:out, draft}; };
  const [dm, cs] = await Promise.all([latest("damageDocs"), latest("casualties")]);
  const b = dm.docs.filter(d=>d.type==="建築物");
  const a = {count:dm.docs.length, draft:dm.draft, casCount:cs.docs.length, casDraft:cs.draft,
    amount:dm.docs.reduce((s,d)=>s+dmgTotal(d),0), floorArea:b.reduce((s,d)=>s+dmgFloorSum(d),0), surfaceArea:b.reduce((s,d)=>s+num(d.surfaceArea),0),
    b:Object.fromEntries(M.burnDegrees.map(k=>[k, b.filter(d=>d.bldg.degree===k).length])), households:b.reduce((s,d)=>s+dmgRSum(d,"h"),0), victims:b.reduce((s,d)=>s+dmgRSum(d,"p"),0),
    dead:cs.docs.filter(x=>x.kind==="死者").length, injured:cs.docs.filter(x=>x.kind==="負傷者").length};
  return a;
}

/* 確定・訂正の共通処理（様式6・7） */
async function confirmDoc({store, doc, caseId, checks, snapshot, title}){
  const l1 = checks.filter(x=>x.lv===1); let note = "";
  if (l1.length){ note = await askReason(`「要確認」が${l1.length}件残っています。このまま確定する場合は理由を入力してください。`); if (!note) return false; }
  else if (!(await askConfirm(`${title}を確定します。確定後の変更は「訂正」として新しい版になります。よろしいですか？`,"確定する"))) return false;
  const version = (doc.version||0)+1;
  try { await tx([store,"revisions","audit"],"readwrite", async t=>{ const ts=nowISO(); const before = await req(t.objectStore(store).get(doc.id));
      const nd = {...doc, status:"確定", version, confirmedAt:ts, updatedAt:ts, confirmNote:note, rev:(before?.rev||0)+1};
      t.objectStore(store).put(nd);
      t.objectStore("revisions").put({id:uuid(), caseId, docId:doc.id, version, at:ts, reason:doc.correctionReason||"", confirmNote:note, snapshot:{...snapshot, doc:nd}});
      t.objectStore("audit").put({id:uuid(), caseId, store, targetId:doc.id, action:`確定（第${version}版）`, reason:note, before, after:nd, at:ts}); });
    toast(`第${version}版として確定しました`); return true; } catch(e){ toast("確定に失敗しました："+e.message, true); return false; }
}

/* 編集画面の共通の入出力（data-path／data-cb は {選択肢:true} の形） */
function bindEditor({d, store, render}){
  let dirty = false; leaveGuard = () => dirty;
  const collect = () => { $$("[data-path]").forEach(el=>setPath(d, el.dataset.path, el.type==="checkbox" ? el.checked : el.value)); };
  const persist = async (action, reason="") => { try { await save(store, d, action, reason); dirty = false; return true; } catch(e){ toast("保存に失敗しました："+e.message, true); return false; } };
  $$("[data-path]").forEach(el=>el.addEventListener(el.tagName==="SELECT"||el.type==="checkbox"?"change":"input", ()=>{ dirty = true; $("#dirty").textContent = "未保存の変更があります"; render?.(); }));
  $("#saveAll").onclick = async ()=>{ collect(); if (await persist("更新")){ toast("保存しました"); router(); } };
  return {collect, persist, clean:()=>{ dirty = false; }};
}

/* =========================================================
   様式8：資料提出命令書／様式9：報告徴収書（発出ごと）
   【マニュアル準拠】第9章。製造業者・輸入業者→消防法第32条第1項、関係者（所有者・管理者・占有者）→第34条第1項
   発出（確定）後は文書の内容をロックし、交付・提出（報告）結果だけを記録として追記・更新する【仮仕様】
   ========================================================= */
M.ordKinds = ["資料提出命令書","報告徴収書"];
M.ordAttrs = ["製造業者・輸入業者","関係者（所有者・管理者・占有者）"];
M.ordDelivery = ["手渡し","郵送","その他"];
const ordForm = k => k==="資料提出命令書" ? "様式8" : "様式9";
const ordArticle = a => a==="製造業者・輸入業者" ? "32" : a ? "34" : "";
function ordAttrFromRoles(roles){
  roles = roles||[];
  if (roles.includes("製造業者・輸入業者")) return "製造業者・輸入業者";
  if (roles.some(r=>/^火元関係者（(所有者|管理者|占有者)）$/.test(r))) return "関係者（所有者・管理者・占有者）";
  return "";
}
function ordLabel(o){ return `${ordForm(o.kind)} ${o.kind}${o.docNo?`（${o.docNo}）`:""}`; }
function newOrder(c, number, kind){
  return {id:uuid(), caseId:c.id, number, kind, status:"作成中", version:0, docNo:"", issueDate:new Date().toISOString().slice(0,10),
    personId:"", corpName:"", attr:"", articleChecked:false, items:"", deadline:"", submitTo:"", voluntary:"",
    track:{deliveredAt:"", method:"", received:"", resultAt:"", resultItems:"", returnAgreement:"", returnDone:"", notes:""}};
}
async function orgSettings(){ return (await getOne("settings","org")) || {id:"org", hq:"", title:"", name:"", review:"", defendant:"", representative:""}; }
function checkOrder(o, person, org, issued){
  const ck = []; const add=(lv,msg,src)=>ck.push({lv,msg,src});
  if (!o.docNo) add(1,"文書番号が未入力です。","第9章第3節①");
  if (!org.hq || !org.title || !org.name) add(1,"権限者（消防本部名・職名・氏名）が本部設定にありません。","第9章第3節②");
  if (!person) add(1,"相手方（関係者から選択）が未設定です。","様式8・9");
  else if (!person.addr) add(2,"相手方の住所が関係者の画面に登録されていません。","様式8・9");
  if (!o.attr) add(1,"相手方の属性（製造業者・輸入業者／関係者）が未選択です。根拠条文が決まりません。","第9章第1節■1");
  else {
    if (!o.articleChecked) add(2,`根拠条文（消防法第${ordArticle(o.attr)}条第1項）を確認したら、確認欄にチェックしてください。`,"項目定義表 様式8・9");
    if (o.attr!=="製造業者・輸入業者" && person && !ordAttrFromRoles(person.roles)) add(1,"第34条の相手方は消防法上の「関係者」（所有者・管理者・占有者）に限られます。関係者の画面の役割を確認してください。","第9章第1節■1⑵");
    if (o.attr==="製造業者・輸入業者" && !o.voluntary) add(1,"製造業者・輸入業者への命令・徴収は、任意の事情聴取等で必要な情報が得られない場合に限り行うものとされています。任意依頼の経過を記録してください。","第9章第1節■1⑴");
  }
  if (!o.items) add(1,`${o.kind==="資料提出命令書"?"提出を命じる事項":"報告を求める事項"}が未入力です。`,"第9章第3節④");
  else if (o.items.length<10) add(3,"命令・報告事項は具体的に記載します。","第9章第3節④");
  if (o.kind==="資料提出命令書" && /報告|作成して/.test(o.items||"")) add(3,"現に存在しないものを文書等で作成させる場合は報告徴収書を使います。","第9章第1節■2");
  if (o.kind==="報告徴収書" && /図面|設計図|記録簿|台帳|保存されている/.test(o.items||"")) add(3,"既に作成済みの資料の提出を求める場合は資料提出命令書を使います。","第9章第1節■2");
  if (!o.deadline) add(1,"期限が未入力です。","様式8・9");
  else if (o.issueDate && o.deadline < o.issueDate) add(1,"期限が発出日より前です。","様式8・9");
  if (!o.submitTo) add(1,`${o.kind==="資料提出命令書"?"提出先":"報告先"}が未入力です。`,"様式8・9");
  if (!org.review || !org.defendant || !org.representative) add(2,"教示の空欄（審査請求先・被告・訴訟で代表する者）が本部設定にありません。違反処理標準マニュアル等を参考に本部で確定します。","第9章第3節④");
  if (issued){
    const t = o.track; const today = new Date().toISOString().slice(0,10);
    if (!t.deliveredAt) add(2,"交付日が未記録です。","交付管理");
    if (o.deadline && o.deadline < today && !t.resultAt) add(2,`期限（${o.deadline}）を過ぎていますが、${o.kind==="資料提出命令書"?"提出":"報告"}の記録がありません。`,"結果");
    if (o.kind==="資料提出命令書" && !t.returnAgreement) add(3,"提出された資料の調査終了後の所有権の有無や返却方法を、書面等で事前に取り決めておくとトラブル防止に効果的です。","第9章第2節");
  }
  return ck;
}
function renderOrderPaper(c, o, person, org){
  const art = ordArticle(o.attr);
  const law = `消防法（${art==="34"?"<s>第３２条</s>":"第３２条"}・${art==="32"?"<s>第３４条</s>":"第３４条"}）第１項`;
  const occ = c.occurrencePrecision==="不明" ? "日時不明" : dtJ(c.occurrenceAt).replace(/頃$/,"");
  const fd = iso => iso ? fmtDate(iso+"T00:00:00") : "　　年　月　日";
  const blank = v => esc(v||"　　　　　　");
  const kyoji = `<div><b>教　示</b></div><div style="text-indent:1em">この命令に不服のある場合は、命令があったことを知った日の翌日から起算して３箇月以内に${blank(org.review)}に対して審査請求することができる。</div>
   <div style="text-indent:1em">また、この命令については、この命令があったことを知った日の翌日から起算して６箇月以内に${blank(org.defendant)}を被告として処分の取消しの訴えを提起することができる（訴訟において${blank(org.defendant)}を代表する者は${blank(org.representative)}となる。）。</div>
   <div style="text-indent:1em">なお、この命令について審査請求をした場合には、当該審査請求に対する裁決があったことを知った日の翌日から起算して６箇月以内に${blank(org.defendant)}を被告として処分の取消しの訴えを提起することができる。</div>`;

const needNote = s => ["確認不能","該当なし","追加調査が必要"].includes(s);
function guidePath(cid, go){ return {photos:`#/case/${cid}/photos`, disp:`#/case/${cid}`, persons:`#/case/${cid}/persons`, doc4:`#/case/${cid}`, locations:`#/case/${cid}/locations`, evidence:`#/case/${cid}/evidence`, iv:`#/case/${cid}`, compare:`#/case/${cid}/iv-compare`, cause:`#/case/${cid}/cause`, report:`#/case/${cid}/report`, home:`#/case/${cid}`}[go] || `#/case/${cid}`; }
const guideGoLabel = {photos:"写真・図面", disp:"案件ホーム（様式3）", persons:"関係者", doc4:"案件ホーム（様式4）", locations:"建物・場所", evidence:"収去物件", iv:"案件ホーム（様式5）", compare:"申述の比較", cause:"様式2", report:"様式1", home:"案件ホーム"};
async function guideFacts(cid){
  const g = async s => live(await byIndex(s,"caseId",cid));
  const [disp, persons, docs, recs, photos, locs, evid, ivs, dmg, cas, ords, cause, rep] = await Promise.all(["dispatchDocs","persons","obsDocs","obsRecords","photos","locations","evidence","interviews","damageDocs","casualties","orders","causeDocs","reportDocs"].map(g));
  const conf = l => l.filter(x=>x.status==="確定").length;
  const cat = k => photos.filter(p=>p.category===k).length;
  const h = {
    disp:`様式3：${disp.length}通（確定${conf(disp)}）`,
    persons:`関係者：発見者${persons.filter(p=>(p.roles||[]).includes("発見者")).length}・通報者${persons.filter(p=>(p.roles||[]).includes("通報者")).length}・初期消火者${persons.filter(p=>(p.roles||[]).includes("初期消火者")).length}・火元関係者${persons.filter(p=>(p.roles||[]).some(r=>r.startsWith("火元関係者"))).length}`,
    doc4:`様式4：${docs.length}通（確定${conf(docs)}）・見分記録${recs.length}件`,
    witness:`立会人あり：様式4 ${docs.filter(d=>(d.witnessIds||[]).length).length}/${docs.length}通`,
    locs:`建物・場所：${locs.length}件`,
    sec3:`様式4の3（焼損状況）の記録：${recs.filter(r=>Number(r.section)===3).length}件`,
    measure:`計測結果の記録：${recs.filter(r=>r.infoType==="計測結果").length}件`,
    evidence:`収去物件：${evid.length}件・鑑識見分調査書${docs.filter(d=>d.category==="鑑識見分").length}通`,
    iv:`様式5：${ivs.length}通（確定${conf(ivs)}）`,
    orders:`様式8・9：${ords.length}通（発出${conf(ords)}）`,
    damage:`様式6：${dmg.length}通（確定${conf(dmg)}）`,
    cas:`様式7：${cas.length}通（確定${conf(cas)}）`,
    cause:`様式2：${cause[0]?cause[0].status+(cause[0].version?"・第"+cause[0].version+"版":""):"未作成"}${cause[0]?`・火源${cause[0].sources.length}件`:""}`,
    report:`様式1：${rep[0]?rep[0].status:"未作成"}`
  };
  return k => k?.startsWith("ph:") ? `写真「${k.slice(3)}」：${cat(k.slice(3))}枚（写真区分による）` : (h[k]||"");
}
async function getGuide(cid){ return (await byIndex("guides","caseId",cid)).find(x=>!x.deleted) || {id:uuid(), caseId:cid, items:{}}; }
function guideSummary(gd, items){
  const st = id => gd.items?.[id]?.status || "未確認";
  const done = items.filter(i=>["確認済み","該当なし"].includes(st(i.id))).length;
  return {done, total:items.length, more:items.filter(i=>st(i.id)==="追加調査が必要").length, unable:items.filter(i=>st(i.id)==="確認不能").length};
}

      if (!(await saveFile(fname, blob))) return;
      await tx(["meta"],"readwrite",t=>{ t.objectStore("meta").put({id:"lastBackup", at:nowISO()}); });
      $("#expOut").textContent = `書き出しました（${Math.round(text.length/1024)}KB、${Object.entries(out.stores).map(([k,v])=>k+":"+v.length).join(" ")}）`;
    } catch(e){ toast("書き出しに失敗しました："+e.message, true); }
  };
  $("#imp").onchange = async e=>{
    const f = e.target.files?.[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.app!=="fire-investigation-app" || !data.stores) throw new Error("このアプリのバックアップファイルではありません");
      const counts = Object.entries(data.stores).map(([k,v])=>`${k}:${v.length}`).join(" ");
      if (!(await askConfirm(`バックアップ（${fmtDTshort(data.exportedAt)}作成、${counts}）を読み込みます。よろしいですか？`,"復元する"))) return;
      await importData(data, "バックアップから復元", f.name);
      $("#impOut").textContent = "復元しました："+counts; toast("復元しました");
    } catch(err){ toast("復元に失敗しました："+err.message, true); $("#impOut").textContent = "失敗："+err.message; }
  };
});

/* ---------- 起動 ---------- */
(async ()=>{
  try { dbOpening = openDB(); db = await dbOpening; } catch(e){ view(`<div class="card"><b>端末内データベースを開けませんでした。</b><br>${esc(e.message)}<br>プライベートブラウズでは保存できない場合があります。</div>`); return; }
  renderStatus();
  router();
})();
</script>
