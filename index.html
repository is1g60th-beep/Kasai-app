<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>火災調査書類作成支援（試作版）</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2329;--muted:#5f6b76;--line:#d9dde1;--acc:#b3261e;--acc2:#1f5f99;--ok:#2e7d32;--warn:#a15c00;--chk:#8a1c1c;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
header.top{position:sticky;top:0;z-index:10;background:#22282e;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header.top .brand{font-weight:700;margin-right:auto}
header.top a{color:#fff;text-decoration:none;padding:6px 10px;border-radius:8px;background:#38414a;font-size:14px}
.status{font-size:12px;padding:4px 12px;background:#eceae4;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.status .off{color:var(--acc);font-weight:700}
.show-s{display:none}
main{max-width:1100px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:8px 0 12px}h2{font-size:17px;margin:18px 0 8px;border-left:4px solid var(--acc);padding-left:8px}h3{font-size:15px;margin:12px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label.f{display:block;font-size:13px;color:var(--muted)}
label.f>span.req::after{content:" *";color:var(--acc)}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:9px;border:1px solid #b9c0c7;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:110px}
input[type=checkbox]{width:auto}
/* チェックボックスは文字ごと押せるようにし、押せる範囲を広げる */
.row>label:has(>input[type=checkbox]),label:has(>input[type=checkbox]){display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 6px 0 0}
input[type=checkbox]{width:20px;height:20px;margin:0 4px 0 0}
.chkcard>summary{list-style-position:inside}
.chkcard[open]>summary{margin-bottom:6px}
button,.btn{font:inherit;font-size:15px;padding:10px 14px;border-radius:8px;border:1px solid #9aa4ad;background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;min-height:44px}
button.pri,.btn.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
button.danger{border-color:var(--acc);color:var(--acc)}
button.sm,.btn.sm{font-size:13px;padding:6px 10px;min-height:36px}
button:disabled{opacity:.45;cursor:not-allowed}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:#e8eef5;color:var(--acc2);margin-right:4px;white-space:nowrap}
.badge.k1{background:#e8f3ea;color:var(--ok)}.badge.k2{background:#fff4e0;color:var(--warn)}.badge.k3{background:#f3e8f5;color:#6a2a7a}.badge.k4{background:#eee;color:#555}.badge.del{background:#f6dada;color:var(--acc)}
.muted{color:var(--muted);font-size:13px}
.rec{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:#fff}
.rec.thinking{background:#faf7fc;border-style:dashed}
.rec .no{font-weight:700;margin-right:6px}
.rec .body{white-space:pre-wrap;margin:4px 0}
.chk{padding:6px 8px;border-radius:6px;margin:4px 0;font-size:14px}
.chk.l1{background:#fbe9e9;color:var(--chk)}.chk.l2{background:#fff4e0;color:var(--warn)}.chk.l3{background:#eef2f6;color:#38495a}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;padding:16px;max-width:520px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.modal-msg{white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#22282e;color:#fff;padding:10px 16px;border-radius:8px;z-index:50;font-size:14px;max-width:90vw}
.toast.err{background:var(--acc)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{width:130px;font-size:12px}
.thumb img{width:130px;height:98px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:#ddd}
.tree ul{list-style:none;padding-left:18px;margin:0}.tree li{margin:3px 0}
.lock{background:#fdf3d8;border:1px solid #e6cf8a;padding:8px 10px;border-radius:8px}
details summary{cursor:pointer;font-weight:700}
.tag-src{font-size:11px;color:#6a2a7a}
/* 書類プレビュー */
.paper{background:#fff;max-width:800px;margin:0 auto;padding:40px 48px;border:1px solid #ccc;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:15px;line-height:1.9}
.paper h1{text-align:center;font-size:20px;letter-spacing:.3em;margin:18px 0}
.paper .right{text-align:right}
.paper table.hd td,.paper table.hd th{border:1px solid #333;padding:4px 8px;font-weight:normal}
.paper .sec{margin-top:14px}
.paper .it{padding-left:2.2em;text-indent:-2.2em;white-space:pre-wrap}
.paper .ph{display:inline-block;width:46%;margin:1%;vertical-align:top;font-size:13px}
.paper .ph img{width:100%;border:1px solid #999}
.draftmark{color:var(--acc);border:2px solid var(--acc);display:inline-block;padding:2px 10px;font-family:sans-serif;font-size:13px}
@media print{header.top,.status,.noprint,.toast{display:none!important}main{padding:0;max-width:none}.paper{border:none;padding:0}body{background:#fff}}
@media (max-width:600px){.paper{padding:16px}main{padding:8px}
  /* スマホでは上部の帯を1行にして、入力欄の表示範囲を広げる */
  header.top{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:6px 8px}
  header.top .brand{white-space:nowrap;font-size:15px}header.top .brand small,.hide-s{display:none}.show-s{display:inline}
  header.top a{white-space:nowrap;padding:5px 8px;font-size:13px}
  .status{font-size:11px;padding:2px 8px;gap:8px}}
</style>

/* ---------- データ層（IndexedDB） ---------- */
const DB_NAME = "fire-investigation-app";
const DB_VER = 9; // v2：収去物件（evidence）／v3：様式2判定書（causeDocs）／v4：様式1調査書（reportDocs）／v5：様式5質問調査書（interviews）／v6：様式3見分調査書（dispatchDocs）／v7：様式6損害調査書（damageDocs）・様式7死傷者の調査書（casualties）／v8：様式8・9（orders）・本部設定（settings）／v9：調査ガイド（guides）
const STORES = {
  cases:["fireNumber"], staff:[], persons:["caseId"], locations:["caseId"],
  obsDocs:["caseId"], obsRecords:["caseId","docId"], photos:["caseId"], blobs:[],
  revisions:["docId","caseId"], audit:["caseId"], meta:[], evidence:["caseId"], causeDocs:["caseId"], reportDocs:["caseId"], interviews:["caseId","personId"], dispatchDocs:["caseId"], damageDocs:["caseId"], casualties:["caseId","personId"], orders:["caseId"], settings:[], guides:["caseId"]
};
let db;
let dbOpening = null; // 起動直後の画面遷移で、DBが開く前に読み込まないよう待ち合わせる
function req(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      for (const [name, idx] of Object.entries(STORES)){
        if (!d.objectStoreNames.contains(name)){
          const s = d.createObjectStore(name, {keyPath:"id"});
          idx.forEach(i=>s.createIndex(i, i, {unique:false}));
        }
      }
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
/* トランザクション：完了（oncomplete）を確認してから成功とする（保存失敗を成功と表示しない） */
function tx(stores, mode, fn){
  return new Promise((res,rej)=>{
    let t; try { t = db.transaction(stores, mode); } catch(e){ rej(e); return; }
    let out; let fnErr = null;
    Promise.resolve().then(()=>fn(t)).then(v=>{ out=v; }).catch(e=>{ fnErr=e; try{t.abort();}catch(_){} });
    t.oncomplete = () => fnErr ? rej(fnErr) : res(out);
    t.onerror = () => rej(fnErr || t.error);
    t.onabort = () => rej(fnErr || t.error || new Error("保存が中断されました"));
  });
}
const getOne = (store,id) => tx([store],"readonly",t=>req(t.objectStore(store).get(id)));
const getAllS = (store) => tx([store],"readonly",t=>req(t.objectStore(store).getAll()));
const byIndex = (store,index,v) => tx([store],"readonly",t=>req(t.objectStore(store).index(index).getAll(v)));
const live = arr => arr.filter(x=>!x.deleted);

/* 保存＝本体と変更履歴を同一トランザクションで書き込む */
function save(store, obj, action, reason){
  return tx([store,"audit"],"readwrite", async t=>{
    const s = t.objectStore(store);
    const before = await req(s.get(obj.id));
    const ts = nowISO();
    if (!before) obj.createdAt = obj.createdAt || ts;
    obj.updatedAt = ts;
    obj.rev = (before?.rev || 0) + 1;
    s.put(obj);
    t.objectStore("audit").put({ id:uuid(), caseId: store==="cases" ? obj.id : (obj.caseId || null), store, targetId:obj.id,
      action: action || (before ? "更新" : "新規登録"), reason: reason || "", before: before || null, after: obj, at: ts });
    return obj;
  });
}
async function invalidate(store, obj, reason){
  if (!reason) throw new Error("無効化の理由が必要です");
  const o = {...obj, deleted:true, deletedReason:reason, deletedAt:nowISO()};
  return save(store, o, "無効化", reason);
}
async function nextNo(store, caseId, key){
  const all = await byIndex(store,"caseId",caseId);
  return all.reduce((m,x)=>Math.max(m, Number(x[key])||0), 0) + 1;
}

/* ---------- 状態表示 ---------- */
async function renderStatus(){
  let persisted = "不明";
  try { if (navigator.storage?.persisted) persisted = (await navigator.storage.persisted()) ? "永続化済み" : "未永続化（ブラウザが容量不足時に削除する可能性）"; } catch(_){}
  const p = persisted==="永続化済み";
  $("#status").innerHTML = `<span class="${navigator.onLine?"":"off"}">${navigator.onLine?"オンライン":"オフライン（端末内に保存されます）"}</span>
    <span class="hide-s">保存先：この端末のブラウザ内のみ（外部送信なし）</span><span class="show-s">端末内のみ保存</span>
    <span class="hide-s">端末保存：${esc(persisted)}</span><span class="show-s ${p?"":"off"}">${p?"永続化済み":persisted==="不明"?"":"未永続化（<a href='#/backup'>設定</a>）"}</span><span>v${APP_VERSION}</span>`;
}
window.addEventListener("online", renderStatus); window.addEventListener("offline", renderStatus);

/* ---------- ルーター ---------- */
const routes = [];
function route(pattern, fn){ routes.push([new RegExp("^"+pattern.replace(/:(\w+)/g,"(?<$1>[^/]+)")+"$"), fn]); }
/* 画面遷移はアプリ内で管理する（アプリ内プレビュー等の埋め込み表示ではリンクの遷移が無効になるため） */
let curPath = (()=>{ try { return location.hash.replace(/^#/,"") || "/"; } catch(_){ return "/"; } })();
/* 画面描画は1つずつ順番に行い、最後に要求された画面で必ず終わるようにする（素早い連続操作で古い画面が上書きしないため） */
let routing = false, routePending = false;
/* 未保存の入力がある画面から移動するときの確認（編集画面が設定し、画面を描画し直すと解除される） */
let leaveGuard = null;
async function renderRoute(){
  const h = curPath || "/"; leaveGuard = null;
  for (const [re, fn] of routes){
    const m = h.match(re);
    if (m){ try { await fn(m.groups || {}); } catch(e){ console.error(e); $("#app").innerHTML = `<div class="card"><b>エラー：</b>${esc(e.message)}</div>`; } window.scrollTo(0,0); return; }
  }
  $("#app").innerHTML = "<p>ページが見つかりません。</p>";
}
async function router(){
  if (routing){ routePending = true; return; }
  routing = true; document.body.dataset.busy = "1";
  try {
    if (!db){ try { db = await dbOpening; } catch(_){ return; } if (!db) return; }
    do { routePending = false; await renderRoute(); } while (routePending);
  } finally { routing = false; document.body.dataset.busy = "0"; }
}
function go(h){
  curPath = String(h).replace(/^#/,"") || "/";
  try { if (location.hash !== "#"+curPath) history.pushState(null, "", "#"+curPath); } catch(_){ /* 埋め込み表示ではURLを変更できないが、画面は切り替える */ }
  router();
}
window.addEventListener("hashchange", ()=>{ try { curPath = location.hash.replace(/^#/,"") || "/"; } catch(_){} router(); });
window.addEventListener("beforeunload", e=>{ if (leaveGuard && leaveGuard()){ e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("popstate", ()=>{ try { curPath = location.hash.replace(/^#/,"") || "/"; } catch(_){} router(); });
document.addEventListener("click", e=>{
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  const href = a.getAttribute("href");
  if (leaveGuard && leaveGuard()){
    askConfirm("保存されていない入力があります。保存せずに移動しますか？","保存せずに移動").then(ok=>{ if (ok){ leaveGuard = null; go(href); } });
    return;
  }
  go(href);
});

/* アプリ内ダイアログ（ブラウザの prompt/confirm は埋め込み表示で使えない場合があるため） */
function dialog({message, input=false, required=true, placeholder="", okLabel="OK"}){
  return new Promise(res=>{
    const ov = document.createElement("div");
    ov.className = "modal-ov";
    ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="modal-msg">${esc(message)}</div>
      ${input?`<textarea class="modal-in" placeholder="${esc(placeholder)}" style="min-height:70px"></textarea>`:""}
      <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="modal-cancel">キャンセル</button><button class="pri modal-ok">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(ov);
    const inp = $(".modal-in", ov), ok = $(".modal-ok", ov);
    const upd = ()=>{ if (input && required) ok.disabled = !inp.value.trim(); };
    if (inp){ inp.addEventListener("input", upd); setTimeout(()=>inp.focus(), 50); }
    upd();
    const close = v => { ov.remove(); res(v); };
    $(".modal-cancel", ov).onclick = ()=>close(input ? null : false);
    ok.onclick = ()=>close(input ? inp.value.trim() : true);
  });
}
const askReason = (message, placeholder="理由を入力") => dialog({message, input:true, placeholder});
const askConfirm = (message, okLabel="実行する") => dialog({message, okLabel});
const view = html => { $("#app").innerHTML = html; };

async function saveCase(base){
  const fireNumber = val("c_no");
  if (!fireNumber) { toast("火災番号は必須です", true); return null; }
  const dup = live(await getAllS("cases")).find(c=>c.fireNumber===fireNumber && c.id!==base.id);
  if (dup){ toast("同じ火災番号の案件が既にあります", true); return null; }
  const c = {...base, fireNumber, fireType:val("c_type"), status:val("c_status"), leadStaffId:val("c_lead"),
    occurrenceAt:fromInput(val("c_occ")), occurrencePrecision:val("c_prec"), notifiedAt:fromInput(val("c_notif")), notifyMethod:val("c_nm"),
    waterAt:fromInput(val("c_water")), controlledAt:fromInput(val("c_ctrl")), extinguishedAt:fromInput(val("c_ext")),
    place:val("c_place"), buildingName:val("c_bname"), officeName:val("c_office"), use:val("c_use"), structure:val("c_struct"),
    floorsAbove:val("c_fa"), floorsBelow:val("c_fb"), investStart:val("c_is"), investEnd:val("c_ie"), notes:val("c_notes")};
  if (c.occurrencePrecision==="不明") c.occurrenceAt = c.occurrenceAt || null;
  try { return await save("cases", c); } catch(e){ toast("保存に失敗しました："+e.message, true); return null; }
}

function timeOrderWarn(c){
  const seq = [["覚知",c.notifiedAt],["放水開始",c.waterAt],["鎮圧",c.controlledAt],["鎮火",c.extinguishedAt]].filter(x=>x[1]);
  const w = [];
  if (c.occurrenceAt && c.notifiedAt && c.occurrenceAt > c.notifiedAt) w.push("出火日時が覚知より後になっています。");
  for (let i=1;i<seq.length;i++) if (seq[i][1] < seq[i-1][1]) w.push(`${seq[i][0]}が${seq[i-1][0]}より前になっています。`);
  return w;
}

/* =========================================================
   写真（原本は変更しない。番号は案件内で自動付与）
   ========================================================= */
async function sha256(blob){ try { const buf = await blob.arrayBuffer(); const h = await crypto.subtle.digest("SHA-256", buf); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join(""); } catch(_){ return ""; } }
const urlCache = new Map();
/* バックアップ形式のデータを読み込む（同じIDは置き換え、ないものは追加）。本体と変更履歴を同じトランザクションで書く */
async function importData(data, action, reason){
  const blobs = await Promise.all((data.stores.blobs||[]).map(async b=>({id:b.id, caseId:b.caseId, data: await dataURLToBlob(b.dataURL)})));
  const names = Object.keys(STORES).filter(s=>s!=="meta" && data.stores[s]);
  const counts = Object.entries(data.stores).map(([k,v])=>`${k}:${v.length}`).join(" ");
  await tx(names.concat(["audit"]).filter((v,i,a)=>a.indexOf(v)===i),"readwrite", t=>{
    for (const s of names){ const rows = s==="blobs" ? blobs : data.stores[s]; for (const r of rows) t.objectStore(s).put(r); }
    t.objectStore("audit").put({id:uuid(), caseId:null, store:"backup", targetId:"-", action, reason, before:null, after:{counts}, at:nowISO()});
  });
  urlCache.clear();
}

/* ファイルの保存：claude.ai の公開ページ内ではブラウザのダウンロードが使えないため、ページの保存機能を使う（閲覧者の確認あり）。
   それ以外のブラウザでは通常のダウンロード。保存できなかったときは false（成功と表示しない） */
const inClaudePage = () => typeof window.claude?.use === "function";
async function saveFile(filename, data){
  if (inClaudePage()){
    let dl = null; try { dl = await window.claude.use("downloads"); } catch(_){}
    if (!dl){ toast("この表示ではファイルを保存できません。ブラウザで直接開いた版をお使いください", true); return false; }
    try { await dl.save({filename, data}); return true; }
    catch(e){ toast(e?.code==="declined" ? "保存を取りやめました" : "保存できませんでした："+(e?.message||e?.code||e), true); return false; }
  }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); return true;
}
/* 印刷：claude.ai の公開ページ内では印刷画面を開けないため、書類部分をHTMLファイルとして保存する（ブラウザで開いて印刷・PDF保存できる） */
async function printPaper(){
  if (!inClaudePage()){ try { window.print(); } catch(_){} return; }
  const paper = $(".paper"); if (!paper) return;
  const css = [...document.querySelectorAll("style")].map(x=>x.textContent).join("\n");
  const title = (paper.querySelector("h1")?.textContent || "書類").replace(/[\\/:*?"<>|\s]/g,"");
  const html = `<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>${esc(title)}</title><style>${css}</style></head><body style="background:#fff">${$(".draftmark")?$(".draftmark").outerHTML:""}${paper.outerHTML}</body></html>`;
  if (await saveFile(`${title}_${new Date().toISOString().slice(0,10)}.html`, html)) toast("HTMLファイルとして保存しました。ブラウザで開いて印刷・PDF保存してください");
}
async function photoURL(p){ if (urlCache.has(p.blobId)) return urlCache.get(p.blobId); const b = await getOne("blobs", p.blobId); if (!b) return ""; const u = URL.createObjectURL(b.data); urlCache.set(p.blobId,u); return u; }
async function addPhotos(caseId, files, defaults={}){
  let no = await nextNo("photos", caseId, "number");
  const added = [];
  for (const f of files){
    const blobId = uuid(); const hash = await sha256(f);
    const p = {id:uuid(), caseId, number:no++, blobId, fileName:f.name, mime:f.type, size:f.size, hash,
      takenAt: f.lastModified ? new Date(f.lastModified).toISOString() : nowISO(), photographerId: defaults.photographerId||"", locationId: defaults.locationId||"",
      shotFrom:"", category:"その他", caption:""};
    await tx(["photos","blobs","audit"],"readwrite", async t=>{
      t.objectStore("blobs").put({id:blobId, caseId, data:f});
      const ts = nowISO(); p.createdAt=ts; p.updatedAt=ts; p.rev=1;
      t.objectStore("photos").put(p);
      t.objectStore("audit").put({id:uuid(), caseId, store:"photos", targetId:p.id, action:"写真登録（原本保存）", reason:"", before:null, after:p, at:ts});
    });
    added.push(p);
  }
  return added;
}

/* =========================================================
   様式4：実況（鑑識）見分調査書
   ========================================================= */
/* 表示用項番：内部IDとは分離。考察は本文外のため項番なし */
function numberRecords(recs){
  const out = new Map();
  for (const s of [1,2,3]){
    let k = 0;
    recs.filter(r=>Number(r.section)===s).sort((a,b)=>(a.order-b.order)||(a.createdAt||"").localeCompare(b.createdAt||"")).forEach(r=>{
      out.set(r.id, r.infoType==="調査員の考察" ? null : `${s}(${++k})`);
    });
  }
  return out;
}
function checkDoc4(d, recs, photos, persons, staff, evid=[]){
  const ck = []; const add=(lv,msg,src)=>ck.push({lv,msg,src});
  const nums = numberRecords(recs);
  if (!d.startAt) add(1,"見分開始日時が未入力です。","第5章第4節■1(3)");
  if (!d.endAt) add(2,"見分終了日時が未入力です。","第5章第4節■1(3)");
  if (d.startAt && d.endAt && d.endAt < d.startAt) add(1,"見分終了日時が開始日時より前です。");
  if (!d.authorStaffId) add(1,"作成者が未設定です。","第5章第2節");
  if (!d.place) add(1,"場所及び物件が未入力です。","第5章第4節■1(4)");
  if (!(d.witnessIds||[]).length && !d.noWitnessReason) add(1,"立会人が未登録で、立会人なしの理由も未記録です。","第5章第4節■1(5)");
  if (d.category==="鑑識見分" && !(d.evidenceIds||[]).some(id=>evid.some(e=>e.id===id))) add(1,"鑑識見分の対象となる収去物件が指定されていません。","第1章第2節／様式4詳細設計1-2");
  for (const e of evid.filter(e=>recs.some(r=>r.id===e.sourceRecordId))){
    const lack = [["採取位置",e.samplingPosition],["収去日時",e.collectedAt],["収去者",e.collectorId],["収去の目的",e.purpose]].filter(x=>!x[1]).map(x=>x[0]);
    if (lack.length) add(2,`収去${e.number}「${e.name}」の${lack.join("・")}が未入力です。`,"第5章第4節■2(3)キ");
  }
  if (!recs.some(r=>Number(r.section)===3 && r.infoType!=="調査員の考察")) add(2,"「3 焼損状況」の記録がありません。","様式4");
  for (const r of recs){
    const no = nums.get(r.id) || "考察";
    const txt = r.content||"";
    if (r.infoType!=="立会人説明" && r.infoType!=="調査員の考察"){
      const hit = M.judgeTerms.filter(t=>txt.includes(t));
      if (hit.length) add(2,`${no}：判定用語「${hit.join("」「")}」が使われています。引用や説明でない場合は、客観的な表現に改めてください。`,"第5章第3節■2");
      if (M.judgeRegex.test(txt)) add(2,`${no}：「〜から出火（延焼）した」という断定表現があります。判断は様式2で行います。`,"第5章第3節■1");
      if (M.lrRegex.test(txt)) add(2,`${no}：「右・左」で位置を示しています。東西南北の方位で表してください。`,"第5章第4節■2(3)オ");
      const vg = M.vagueWords.filter(w=>txt.includes(w));
      if (vg.length) add(3,`${no}：「${vg.join("」「")}」など、程度を表す語は具体的な状態や数値に置き換えられないか確認してください。`,"第5章第3節■2・5");
    }
    if (Number(r.section)===3 && r.infoType==="見分事実" && (!r.position || !r.direction || !r.target)) add(2,`${no}：見分位置・見分方向・見分対象のいずれかが未入力です。`,"第5章第4節■2(3)オ");
    if (r.infoType==="立会人説明" && !r.witnessId) add(1,`${no}：立会人説明に説明者が設定されていません。`,"第5章第3節■3");
    if (r.infoType==="計測結果" && !r.measValue) add(1,`${no}：計測結果に計測値がありません。`);
    if ((r.photoIds||[]).length && txt.length < 15 && r.infoType!=="調査員の考察") add(3,`${no}：本文が短く、写真に頼った記述になっていないか確認してください（写真は補足資料）。`,"第5章第4節■2(3)カ");
    for (const pid of (r.photoIds||[])){ const p = photos.find(x=>x.id===pid); if (!p) add(1,`${no}：関連付けた写真が無効化されています。`); else if (!p.photographerId) add(2,`${no}：写真${p.number}の撮影者が未設定です。`,"様式4の5"); }
    if (r.infoType==="調査員の考察") add(3,`考察「${txt.slice(0,20)}…」は本文に出力されません（様式2で使用）。`,"仕様書6-3");
    const ev = evid.filter(e=>e.sourceRecordId===r.id);
    if (ev.length && !txt.includes("収去")) add(3,`${no}：この記録から収去${ev.map(e=>e.number).join("・")}を登録しています。収去した事実（位置・目的）を本文にも記載してください。`,"第5章第4節■2(3)キ");
  }
  return ck;
}
function recordText(r, persons){
  const pRefs = (r.photoIds||[]).length ? `（${r._photoNos.map(n=>"写真"+n).join("、")}参照）` : "";
  if (r.infoType==="立会人説明"){
    const w = persons.find(p=>p.id===r.witnessId);
    return `立会人${w?w.name:"（未設定）"}${w&&w.age?`（${w.age}歳）`:""}の説明によると、「${r.content}」とのことである。${pRefs}`;
  }
  let t = r.content || "";
  if (r.infoType==="計測結果" && r.measValue) t += `（計測値：${r.measValue}${r.measUnit||""}${r.measMethod?"、"+r.measMethod:""}）`;
  return t + pRefs;
}

    const typeChange = ()=>{ const t=val("r_type"); $("#r_witwrap").style.display = t==="立会人説明"?"":"none"; $("#r_measwrap").style.display = t==="計測結果"?"grid":"none";
      $("#r_hint").textContent = t==="調査員の考察" ? "考察は様式4の本文に出力されず、原因判定（様式2）で使用します。" : t==="立会人説明" ? "書類では「立会人〇〇の説明によると、『…』とのことである。」と出力します。" : ""; };
    $("#r_type").onchange = typeChange; typeChange();
    const fill = r => { $("#r_id").value=r?.id||""; $("#r_sec").value=String(r?.section||3); $("#r_type").value=r?.infoType||"見分事実"; $("#r_at").value=localInput(r?.observedAt||nowISO());
      $("#r_obs").value=r?.observerId||d.authorStaffId||""; $("#r_loc").value=r?.locationId||""; $("#r_pos").value=r?.position||""; $("#r_dir").value=r?.direction||""; $("#r_target").value=r?.target||"";
      $("#r_wit").value=r?.witnessId||""; $("#r_mv").value=r?.measValue||""; $("#r_mu").value=r?.measUnit||""; $("#r_mm").value=r?.measMethod||""; $("#r_content").value=r?.content||""; $("#r_notes").value=r?.notes||"";
      $$("#r_photos input").forEach(cb=>cb.checked=(r?.photoIds||[]).includes(cb.value)); $("#rfTitle").textContent = r ? "見分記録を編集" : "見分記録を追加"; typeChange(); };
    // 入力途中の自動保存（下書き）【独自提案】
    try { const dr = JSON.parse(localStorage.getItem(draftKey)||"null"); if (dr && dr.content && !dr.id){ fill(dr); $("#r_draft").textContent = "入力途中の下書きを復元しました"; } } catch(_){}
    const saveDraft = ()=>{ try { localStorage.setItem(draftKey, JSON.stringify({id:val("r_id"), section:val("r_sec"), infoType:val("r_type"), content:$("#r_content").value, position:val("r_pos"), direction:val("r_dir"), target:val("r_target"), locationId:val("r_loc")})); $("#r_draft").textContent="下書きを端末に一時保存"; } catch(_){} };
    $("#r_content").addEventListener("input", saveDraft);
    $("#r_clear").onclick = ()=>{ fill(null); try{localStorage.removeItem(draftKey);}catch(_){} $("#r_draft").textContent=""; };
    $("#r_newphoto").onchange = async e=>{ const files=Array.from(e.target.files||[]); if(!files.length) return; saveDraft();
      try { const a = await addPhotos(cid, files, {photographerId:val("r_obs"), locationId:val("r_loc")}); toast(`写真${a.map(p=>p.number).join("、")}を保存しました。写真画面で説明を入力できます`);
        const keep = {id:val("r_id"), section:val("r_sec"), infoType:val("r_type"), content:$("#r_content").value, position:val("r_pos"), direction:val("r_dir"), target:val("r_target"), locationId:val("r_loc"), photoIds:$$("#r_photos input:checked").map(x=>x.value).concat(a.map(p=>p.id))};
        try{ localStorage.setItem(draftKey, JSON.stringify(keep)); }catch(_){}
        await router(); try { const dr = JSON.parse(localStorage.getItem(draftKey)); fill(dr); } catch(_){}
      } catch(err){ toast("写真の保存に失敗しました："+err.message, true); } };
    $("#r_save").onclick = async ()=>{
      const content = $("#r_content").value.trim(); const infoType = val("r_type");
      if (!content) return toast("内容は必須です", true);
      if (infoType==="立会人説明" && !val("r_wit")) return toast("説明した立会人を選んでください", true);
      if (infoType==="計測結果" && !val("r_mv")) return toast("計測値を入力してください", true);
      const rid = val("r_id"); const section = Number(val("r_sec"));
      let base;
      if (rid) base = await getOne("obsRecords", rid);
      else { const maxOrder = recs.filter(r=>Number(r.section)===section).reduce((m,r)=>Math.max(m,r.order||0),0); base = {id:uuid(), caseId:cid, docId:did, order:maxOrder+1}; }
      if (rid && Number(base.section)!==section){ base.order = recs.filter(r=>Number(r.section)===section).reduce((m,r)=>Math.max(m,r.order||0),0)+1; }
      const rec = {...base, section, infoType, observedAt:fromInput(val("r_at")), observerId:val("r_obs"), locationId:val("r_loc"), position:val("r_pos"), direction:val("r_dir"), target:val("r_target"),
        witnessId: infoType==="立会人説明" ? val("r_wit") : "", measValue: infoType==="計測結果" ? val("r_mv") : "", measUnit: infoType==="計測結果"?val("r_mu"):"", measMethod: infoType==="計測結果"?val("r_mm"):"",
        content, photoIds:$$("#r_photos input:checked").map(x=>x.value), notes:val("r_notes")};
      let reason = "";
      if (rid && base.content !== content) { reason = await askReason("記録の内容を変更します。変更理由を入力してください（変更前の内容は履歴に残ります）") || ""; if (!reason) return toast("変更理由がないため保存を中止しました", true); }
      try { await save("obsRecords", rec, rid?"更新":"新規登録", reason); try{localStorage.removeItem(draftKey);}catch(_){} toast("保存しました"); router(); } catch(e){ toast("保存に失敗しました："+e.message, true); }
    };
    $$("[data-edit]").forEach(b=>b.onclick=()=>{ fill(recs.find(r=>r.id===b.dataset.edit)); $("#recForm").scrollIntoView({behavior:"smooth"}); });
    $$("[data-del]").forEach(b=>b.onclick=async()=>{ const r=await askReason("記録を無効化します（履歴に残ります）。理由："); if(!r) return; try{ await invalidate("obsRecords", recs.find(x=>x.id===b.dataset.del), r); router(); }catch(e){ toast(e.message,true);} });
    const move = async (id, dir)=>{ const r = recs.find(x=>x.id===id); const sib = recs.filter(x=>Number(x.section)===Number(r.section)).sort((a,b)=>a.order-b.order); const i = sib.indexOf(r); const j = i+dir; if (j<0||j>=sib.length) return;
      const o = sib[j]; try { await tx(["obsRecords","audit"],"readwrite", async t=>{ const s=t.objectStore("obsRecords"); const a={...r, order:o.order, updatedAt:nowISO()}, b={...o, order:r.order, updatedAt:nowISO()}; s.put(a); s.put(b);
        t.objectStore("audit").put({id:uuid(), caseId:cid, store:"obsRecords", targetId:r.id, action:"並べ替え", reason:"", before:{order:r.order}, after:{order:o.order}, at:nowISO()}); }); router(); } catch(e){ toast(e.message,true); } };
    $$("[data-up]").forEach(b=>b.onclick=()=>move(b.dataset.up,-1));
    $$("[data-down]").forEach(b=>b.onclick=()=>move(b.dataset.down,1));
    $("#d_confirm").onclick = async ()=>{
      const l1 = checks.filter(x=>x.lv===1);
      let note = "";
      if (l1.length){ note = await askReason(`「要確認」が${l1.length}件残っています。このまま確定する場合は理由を入力してください。`) || ""; if (!note) return; }
      else if (!(await askConfirm("この調書を確定します。確定後の変更は「訂正」として新しい版になります。よろしいですか？","確定する"))) return;
      const version = (d.version||0)+1;
      const snapEv = levid.filter(e=>(d.evidenceIds||[]).includes(e.id) || recs.some(r=>r.id===e.sourceRecordId));
      const evLabels = {}; for (const e of snapEv) evLabels[e.id] = await evidenceSourceLabel(e);
      const snap = {doc:d, records:recs, photos:lp.filter(p=>recs.some(r=>(r.photoIds||[]).includes(p.id))), persons:lpers, staff, locations:llocs, case:c, evidence:snapEv, evLabels};
      try { await tx(["obsDocs","revisions","audit"],"readwrite", async t=>{
          const ts=nowISO(); const nd={...d, status:"確定", version, confirmedAt:ts, updatedAt:ts, confirmNote:note, rev:(d.rev||0)+1};
          t.objectStore("obsDocs").put(nd);
          t.objectStore("revisions").put({id:uuid(), caseId:cid, docId:did, version, at:ts, reason:d.correctionReason||"", confirmNote:note, snapshot:snap});
          t.objectStore("audit").put({id:uuid(), caseId:cid, store:"obsDocs", targetId:did, action:`確定（第${version}版）`, reason:note, before:d, after:nd, at:ts}); });
        toast(`第${version}版として確定しました`); router(); } catch(e){ toast("確定に失敗しました："+e.message, true); }
    };
    $("#d_del").onclick = async ()=>{ const r=await askReason("調書を無効化します（履歴に残ります）。理由："); if(!r) return; try{ await invalidate("obsDocs", d, r); go("#/case/"+cid); }catch(e){ toast(e.message,true);} };
  } else {
    $("#d_correct").onclick = async ()=>{ const r = await askReason("訂正理由を入力してください（確定済みの版はそのまま保存されます）"); if (!r) return;
      try { await save("obsDocs", {...d, status:"訂正中", correctionReason:r}, "訂正開始", r); router(); } catch(e){ toast(e.message,true); } };
  }
});

/* =========================================================
   収去物件（実況見分の記録から登録し、鑑識見分調査書と紐付ける）
   【マニュアル準拠】収去の事実・採取位置・目的を記録（第5章第4節■2(3)キ）
   【独自提案】保管履歴・返却の管理
   ========================================================= */
M.provenance = ["任意提出","所有者等の承諾","資料提出命令（様式8）","その他"];
M.evStatus = ["保管中","鑑識中","返却済み","廃棄","その他"];
M.custodyActions = ["収去","保管","移送","受渡し","鑑識","返却","廃棄","その他"];

/* 収去元の表示：「実況見分調査書（第1回）3(2)」 */
async function evidenceSourceLabel(e){
  if (!e?.sourceRecordId) return "";
  const r = await getOne("obsRecords", e.sourceRecordId); if (!r) return "";
  const d = await getOne("obsDocs", r.docId); if (!d) return "";
  const recs = live(await byIndex("obsRecords","docId",d.id));
  const no = numberRecords(recs).get(r.id) || "";
  return `${d.category==="鑑識見分"?"鑑識":"実況"}見分調査書（第${d.round}回）${no}で収去`;
}

route("/case/:id/evidence", async ({id})=>{
  const c = await getOne("cases", id);
  const [ev, docs] = await Promise.all([byIndex("evidence","caseId",id), byIndex("obsDocs","caseId",id)]);
  const lev = live(ev).sort((a,b)=>a.number-b.number); const ldocs = live(docs);
  const rows = [];
  for (const e of lev){
    const fd = ldocs.filter(d=>d.category==="鑑識見分" && (d.evidenceIds||[]).includes(e.id)).sort((a,b)=>a.round-b.round);
    rows.push(`<a class="card" style="display:block;color:inherit;text-decoration:none" href="#/case/${id}/evidence/${e.id}">
      <b>収去${e.number}</b> ${esc(e.name)} <span class="badge k2">${esc(e.status||"")}</span>
      <div class="muted">${esc(await evidenceSourceLabel(e))}${e.samplingPosition?"／採取位置："+esc(e.samplingPosition):""}</div>
      <div class="muted">鑑識見分：${fd.map(d=>"第"+d.round+"回").join("、") || "未作成"}</div></a>`);
  }
  view(`<h1>収去物件　<small class="muted">${esc(c.fireNumber)}</small></h1><a class="btn sm" href="#/case/${id}">← 案件ホーム</a>
  <p class="muted">収去物件は、実況見分調査書の記録（収去元）から登録します。各記録の「＋この記録から収去物件を登録」を使ってください。</p>
  ${rows.join("") || '<div class="card muted">収去物件はありません。</div>'}`);
});

async function evidenceForm({id, eid, rec}){
  const c = await getOne("cases", id);
  const [staff, docs, recsAll, photos] = await Promise.all([getAllS("staff"), byIndex("obsDocs","caseId",id), byIndex("obsRecords","caseId",id), byIndex("photos","caseId",id)]);
  const ldocs = live(docs); const lstaff = live(staff); const lp = live(photos).sort((a,b)=>a.number-b.number);
  const e = eid ? await getOne("evidence", eid) : null;
  if (eid && (!e || e.deleted)) return view(`<div class="card">収去物件が見つかりません。<a href="#/case/${id}/evidence">一覧へ</a></div>`);
  // 収去元の候補：実況見分調査書の記録（考察を除く）
  const srcOpts = [];
  for (const d of ldocs.filter(d=>d.category==="実況見分").sort((a,b)=>a.round-b.round)){
    const rs = live(recsAll).filter(r=>r.docId===d.id);
    const nums = numberRecords(rs);
    rs.filter(r=>r.infoType!=="調査員の考察").sort((a,b)=>(a.section-b.section)||(a.order-b.order)).forEach(r=>srcOpts.push({id:r.id, label:`第${d.round}回 ${nums.get(r.id)}　${(r.content||"").slice(0,28)}`}));
  }
  const srcId = e?.sourceRecordId || rec || "";
  const fdocs = e ? ldocs.filter(d=>d.category==="鑑識見分" && (d.evidenceIds||[]).includes(e.id)).sort((a,b)=>a.round-b.round) : [];
  const custody = (e?.custody||[]).slice().sort((a,b)=>(a.at||"").localeCompare(b.at||""));
  view(`<a class="btn sm" href="#/case/${id}/evidence">← 収去物件一覧</a>
  <h1>${e ? `収去${e.number}　${esc(e.name)}` : "収去物件を登録"}　<small class="muted">${esc(c.fireNumber)}</small></h1>
  <div class="card"><div class="grid">
    ${field("物件・試料名",`<input id="e_name" value="${esc(e?.name)}" placeholder="例：畳床の藁の一部">`,true)}
    ${field("収去元の見分記録",`<select id="e_src">${optObj(srcOpts, srcId, o=>o.label)}</select>`,true)}
    ${field("採取位置",`<input id="e_pos" value="${esc(e?.samplingPosition)}" placeholder="例：写真5に示すAからCの3か所">`)}
    ${field("実測距離",`<input id="e_dist" value="${esc(e?.distance)}" placeholder="例：西側壁面から1.2m">`)}
    ${field("収去日時",`<input type="datetime-local" id="e_at" value="${localInput(e?.collectedAt || (e?"":nowISO()))}">`)}
    ${field("収去者",`<select id="e_by">${optObj(lstaff, e?.collectorId || c.leadStaffId, staffLabel)}</select>`)}
    ${field("収去の目的",`<input id="e_purpose" value="${esc(e?.purpose)}" placeholder="例：油脂の種類を特定するため">`)}
    ${field("提出・承諾の経過",`<select id="e_prov">${opt([""].concat(M.provenance), e?.provenance||"")}</select>`)}
    ${field("経過の補足",`<input id="e_provnote" value="${esc(e?.provenanceNote)}">`)}
    ${field("保管場所",`<input id="e_store" value="${esc(e?.storagePlace)}">`)}
    ${field("状態",`<select id="e_status">${opt(M.evStatus, e?.status||"保管中")}</select>`)}
    ${field("返却の取り決め・状況",`<input id="e_return" value="${esc(e?.returnInfo)}" placeholder="例：鑑識終了後に所有者へ返却">`)}
  </div>
  <div style="margin-top:6px"><span class="muted">関連する写真</span><div class="row" id="e_photos">${lp.map(p=>`<label style="font-size:13px"><input type="checkbox" value="${p.id}" ${(e?.photoIds||[]).includes(p.id)?"checked":""}> 写真${p.number}</label>`).join("") || '<span class="muted">写真なし</span>'}</div></div>
  ${field("備考",`<input id="e_notes" value="${esc(e?.notes)}">`)}
  <p class="muted">収去した事実（位置・目的）は、収去元の見分記録の本文にも記載してください（例：「油脂の種類を特定するため、写真5に示すAからCの3か所から畳床の藁の一部を収去する。」）【マニュアル準拠】</p>
  <div class="row"><button class="pri" id="e_save">${e?"保存":"登録"}</button>${e?'<button class="danger sm" id="e_del">無効化</button>':""}</div></div>
  ${e ? `<h2>鑑識見分調査書</h2>
   ${fdocs.map(d=>`<a class="card" style="display:block;color:inherit;text-decoration:none" href="#/case/${id}/doc4/${d.id}"><b>第${d.round}回</b> 鑑識見分 <span class="badge ${d.status==="確定"?"k1":"k2"}">${esc(d.status)}</span></a>`).join("") || '<p class="muted">まだありません。</p>'}
   <button class="pri" id="e_newdoc">＋この物件の鑑識見分調査書を作成</button>
   <h2>保管・受渡しの履歴【独自提案】</h2>
   <div class="card"><table><tr><th>日時</th><th>内容</th><th>担当</th><th>場所・相手</th><th>備考</th></tr>
    ${custody.map(h=>`<tr><td>${esc(fmtDTshort(h.at))}</td><td>${esc(h.action)}</td><td>${esc(staffLabel(staff.find(s=>s.id===h.staffId)||{name:""}))}</td><td>${esc(h.place)}</td><td>${esc(h.note)}</td></tr>`).join("") || '<tr><td colspan="5" class="muted">履歴なし</td></tr>'}</table>

  $("#e_save").onclick = async ()=>{

    let reason = "";
    if (e){ reason = await askReason("収去物件の情報を変更します。変更理由を入力してください（変更前の内容は履歴に残ります）"); if (!reason) return; }

  };
  $("#e_newdoc").onclick = async ()=>{
    try {
      const round = await nextNo("obsDocs", id, "round");

  };
}

/* 書類プレビュー（印刷・PDF保存） */
route("/case/:cid/doc4/:did/preview(?:\\?v=(?<v>\\d+))?", async ({cid, did, v})=>{
  let c, d, recs, photos, persons, staff, locs, verLabel, evidence = [], evLabels = {};
  if (v){
    const rv = (await byIndex("revisions","docId",did)).find(x=>String(x.version)===v);
    if (!rv) return view("版が見つかりません");
    ({case:c, doc:d, records:recs, photos, persons, staff, locations:locs} = rv.snapshot); evidence = rv.snapshot.evidence || []; evLabels = rv.snapshot.evLabels || {}; verLabel = `確定版（第${v}版）`;
  } else {
    [c, d, staff, persons, locs, photos, recs] = await Promise.all([getOne("cases",cid), getOne("obsDocs",did), getAllS("staff"), byIndex("persons","caseId",cid), byIndex("locations","caseId",cid), byIndex("photos","caseId",cid), byIndex("obsRecords","docId",did)]);
    recs = live(recs); photos = live(photos); persons = live(persons);
    evidence = live(await byIndex("evidence","caseId",cid)); for (const e of evidence.filter(e=>(d.evidenceIds||[]).includes(e.id))) evLabels[e.id] = await evidenceSourceLabel(e);
    verLabel = d.status==="確定" ? `確定版（第${d.version}版）` : "";

/* =========================================================
   様式2：火災原因判定書
   【マニュアル準拠】構成：1出火建物→2出火箇所→3出火原因（火源ごとの検討・消去法）→4その他（第3章第3節・様式2）
   【マニュアル準拠】根拠は各調査書に記載された事実のみ。引用は書類名・記載箇所・内容を明示（第3章第2節■2）
   ========================================================= */
M.citeMethods = ["原文","抜粋","要約"];
M.citeDirections = ["肯定","否定","補足"];
M.evaluations = ["未検討","否定","採用"];
M.certainty = ["判定する","推定する","不明とする"];
M.weakNegation = ["ほとんど考えられない","考えにくい","可能性は少ない","可能性は低い","可能性が低い","可能性が少ない"];
M.subSections = {s1:"実況見分状況", s2:"出火出場時の見分状況", s3:"発見状況"};
M.sixPoints = [
  "発火源は、着火物を燃焼させる熱エネルギーを持っているか",
  "発火源と着火物の距離など、両者が出火に至る状態にあるか",
  "着火物は燃焼を継続する状態にあるか",
  "カーテンの存在など、延焼拡大する条件があるか",
  "実況見分結果に、これらを証する状況証拠があるか",
  "質問調査書等に、発火源と着火物が出火に結びつく状態にあったことが聴取されているか"
];
const KANA = "アイウエオカキクケコサシスセソタチツテトナニヌネノ".split("");
const MARU = ["","⑴","⑵","⑶","⑷","⑸","⑹","⑺","⑻","⑼","⑽","⑾","⑿","⒀","⒁","⒂"];

function newCauseDoc(caseId, authorStaffId){
  const sec = ()=>({s1:{cits:[]}, s2:{cits:[]}, s3:{cits:[]}, conclusion:""});
  return {id:uuid(), caseId, status:"作成中", version:0, docDate:new Date().toISOString().slice(0,10), authorStaffId:authorStaffId||"",
    bldg:{...sec(), omit:false, omitReason:""}, origin:{...sec(), locationId:"", rangeText:""},
    sources:[], final:{sourceId:"", process:"", firstIgnited:"", inducement:"", certainty:"", text:"", unknownReason:""},
    other:{insurance:"", materials:""}};
}
function getPath(o, p){ return p.split(".").reduce((a,k)=>a?.[k], o); }
function setPath(o, p, v){ const ks=p.split("."); const last=ks.pop(); const t=ks.reduce((a,k)=>(a[k]??={}), o); t[last]=v; }
function citeList(d, target){ if (target.startsWith("src:")) return d.sources.find(s=>s.id===target.slice(4))?.cits; return getPath(d, target+".cits"); }
function allCits(d){ const out=[]; for (const k of ["bldg","origin"]) for (const s of ["s1","s2","s3"]) out.push(...(d[k][s].cits||[]).map(c=>({c, where:`${k==="bldg"?"1":"2"}${MARU[s.slice(1)]}`})));
  d.sources.forEach((s,i)=>out.push(...(s.cits||[]).map(c=>({c, where:`3${MARU[i+1]}${s.name}`})))); return out; }

/* 引用できる記録（現時点は様式4の見分記録。様式3・5は実装後に追加） */
async function citableRecords(caseId){
  const [docs, recs] = await Promise.all([byIndex("obsDocs","caseId",caseId), byIndex("obsRecords","caseId",caseId)]);
  const out = [];
  for (const d of live(docs).sort((a,b)=>a.round-b.round)){
    const rs = live(recs).filter(r=>r.docId===d.id); const nums = numberRecords(rs);
    for (const r of rs.filter(r=>r.infoType!=="調査員の考察").sort((a,b)=>(a.section-b.section)||(a.order-b.order)))
      out.push({id:r.id, sourceType:"obsRecord", rec:r, doc:d, docLabel:`${d.category==="鑑識見分"?"鑑識":"実況"}見分調査書（第${d.round}回）`, no:nums.get(r.id)||"", text:r.content||"", infoType:r.infoType, locationId:r.locationId, status:d.status});
  }
  // 様式3の見分（記載単位）。項番は「2⑵ア」の形（同じ項目の何番目の記載か）
  const [dds, stf] = await Promise.all([byIndex("dispatchDocs","caseId",caseId), getAllS("staff")]);
  for (const dd of live(dds).sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||"")))
    for (const [k,no] of M.dispSections) (dd.sections[k]||[]).filter(x=>(x.text||"").trim()).forEach((para,i)=>
      out.push({id:para.id, sourceType:"dispatch", rec:{rev:dd.rev}, doc:dd, docLabel:dispLabel(dd,stf), no:no+(KANA[i]||""), text:para.text, infoType:para.infoType||"見分事実", locationId:null, status:dd.status}));
  // 様式5の申述（段落単位）。情報区分は「申述」のまま【基本方針：申述を見分事実に変換しない】
  const [ivs, ps] = await Promise.all([byIndex("interviews","caseId",caseId), byIndex("persons","caseId",caseId)]);
  for (const iv of live(ivs).sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""))){
    const p = ps.find(x=>x.id===iv.personId);
    for (const [k,no] of M.ivSections) for (const para of (iv.sections[k]||[])) if ((para.text||"").trim())
      out.push({id:para.id, sourceType:"interview", rec:{rev:iv.rev}, doc:iv, docLabel:ivLabel(iv,p), no, text:para.text, infoType:"申述", locationId:null, status:iv.status});
  }
  return out;
}
function citeStatus(c, src){
  if (!src) return {lv:1, msg:"引用元の記録が見つからないか無効化されています"};
  const probs = [];
  if (src.text !== c.originalText) probs.push({lv:1, msg:"引用元変更あり（引用後に元の記録が修正されています）"});
  if (c.method==="抜粋" && !c.originalText.replace(/\s/g,"").includes((c.quote||"").replace(/\s/g,""))) probs.push({lv:1, msg:"抜粋が原文と一致しません"});
  if (c.method==="要約" && !c.verified) probs.push({lv:1, msg:"要約が原文と照合されていません"});
  return probs[0] || null;
}
function citeSentence(c, label, sameAsPrev){
  const where = sameAsPrev ? `同調査書${c.no||""}` : label;
  if (c.method==="要約") return `${where}に記載のとおり、${c.quote}`;
  if (c.infoType==="立会人説明") return `${where}に記載のとおり、立会人の説明として「${c.quote}」とある。`;
  return `${where}に記載のとおり、「${c.quote}」とある。`;
}

function checkCause(d, srcMap, locs){
  const ck = []; const add=(lv,msg,src)=>ck.push({lv,msg,src});
  if (!d.authorStaffId) add(1,"判定者（作成者）が未設定です。","様式2");
  if (d.bldg.omit){ if (!d.bldg.omitReason) add(2,"出火建物の判定を省略する理由が未入力です。","第3章第3節"); }
  else { if (!d.bldg.conclusion) add(1,"出火建物の判定の結論が未入力です（明らかな場合は省略できます）。","第3章第3節");
         if (!d.bldg.s1.cits.length) add(2,"出火建物の判定に実況見分状況からの引用がありません。","第3章第2節■1"); }
  if (!d.origin.conclusion) add(1,"出火箇所の判定の結論が未入力です（棟数にかかわらず必須）。","第3章第3節");
  if (!d.origin.s1.cits.length) add(1,"出火箇所の判定に実況見分状況からの引用がありません。実況見分調査書は判定の根拠の主体です。","第3章第2節■1");
  if (!d.origin.locationId && !d.origin.rangeText) add(2,"出火箇所（場所・範囲）が未設定です。","仕様書8-2");
  if (!d.sources.length) add(1,"出火箇所に存在する火源が1つも挙げられていません。","第3章第3節");
  const adopted = d.sources.filter(s=>s.evaluation==="採用");
  for (const s of d.sources){
    if (s.evaluation==="未検討" || !s.evaluation) add(2,`火源「${s.name}」の検討結果（否定・採用）が未選択です。`);
    if (s.evaluation==="否定" && !s.cits.some(c=>c.direction==="否定")) add(1,`火源「${s.name}」を否定する反証（否定の根拠）が引用されていません。`,"第3章第3節■3");
    if (s.evaluation==="採用" && !s.cits.some(c=>c.direction==="肯定")) add(1,`発火源とした「${s.name}」を支持する根拠（肯定）が引用されていません。`,"第3章第2節■2");
    if (!s.consideration) add(2,`火源「${s.name}」の結論（考察）が未入力です。`);
  }
  const f = d.final;
  if (!f.certainty) add(1,"最終判定の区分（判定する・推定する・不明とする）が未選択です。","仕様書8-7");
  if (f.certainty && f.certainty!=="不明とする"){
    if (adopted.length!==1) add(1,`発火源として「採用」した火源が${adopted.length}件です。判定・推定する場合は1件にしてください。`);
    if (!f.sourceId) add(1,"最終判定の発火源が選ばれていません。");
    if (!f.process) add(2,"出火に至る経過が未入力です。","第3章第3節");
    if (!f.firstIgnited) add(2,"着火物が未入力です。","第3章第3節");
    const s = d.sources.find(x=>x.id===f.sourceId);
    if (s) M.sixPoints.forEach((p,i)=>{ if (!(s.points?.[i]||"").trim()) add(2,`発火源「${s.name}」の立証：観点${i+1}「${p}」の根拠が未記入です。`,"第3章第3節■3"); });
  }
  if (f.certainty==="不明とする" && !f.unknownReason) add(1,"不明とする理由（検討した火源と特定に至らなかった理由）が未入力です。","仕様書8-7");
  if (!f.text) add(2,"出火原因の結論の文章が未入力です。");
  // 否定表現
  const texts = [["1⑷",d.bldg.conclusion],["2⑷",d.origin.conclusion],["3結論",f.text],["不明の理由",f.unknownReason]].concat(d.sources.map(s=>[`3「${s.name}」`,s.consideration])).concat(allCits(d).map(x=>[x.where,x.c.judgement]));
  for (const [w,t] of texts){ const hit = M.weakNegation.filter(x=>(t||"").includes(x)); if (hit.length) add(2,`${w}：「${hit.join("」「")}」は可能性を残すと解釈されます。否定は「認められない」「否定される」と明確にしてください。`,"第3章第3節■3"); }
  // 引用の状態
  for (const {c, where} of allCits(d)){
    const st = citeStatus(c, srcMap.get(c.sourceId)); if (st) add(st.lv, `${where}の引用（${c.docLabel}${c.no}）：${st.msg}。`, "第3章第2節■2");
    if (!c.judgement) add(3, `${where}の引用（${c.docLabel}${c.no}）：引用から判断できることが未記入です。`, "第3章第2節■2");
  }
  const originBasis = d.origin.s1.cits.concat(d.origin.s2.cits);
  for (const key of ["bldg","origin"]){ const nm = key==="bldg"?"1":"2";
    if (d[key].s1.cits.some(c=>c.sourceType==="interview")) add(2,`${nm}⑴実況見分状況に質問調査書の申述が引用されています。申述は⑶発見状況（質問調査書等）で取り上げてください。`,"第3章第3節");
    if (d[key].s1.cits.some(c=>c.sourceType==="dispatch")) add(2,`${nm}⑴実況見分状況に出火出動時における見分調査書が引用されています。⑵出火出場時の見分状況で取り上げてください。`,"第3章第3節"); }
  for (const {c:x, where} of allCits(d)){ const s = srcMap.get(x.sourceId); if (s && s.sourceType==="interview" && s.status!=="確定") add(2,`${where}の引用（${x.docLabel}${x.no}）：引用元の質問調査書が確定（読み聞かせ等の確認）前です。`,"第6章第3節");
    if (s && s.sourceType==="dispatch" && s.status!=="確定") add(3,`${where}の引用（${x.docLabel}${x.no}）：引用元の出火出動時における見分調査書が確定前です。`); }
  if (originBasis.length && originBasis.every(c=>c.infoType==="立会人説明")) add(2,"出火箇所の判定根拠が立会人の説明だけです。見分事実による裏付けを確認してください。","第3章第2節■1");
  return ck;
}

function renderCausePaper(c, d, staff, srcMap, labelOf){
  const author = staff.find(s=>s.id===d.authorStaffId);
  const citeBlock = (cits) => { let prevDoc = null;
    return cits.map((x,i)=>{ const lbl = labelOf(x); const same = prevDoc===x.docId; prevDoc = x.docId;
      return `<div class="it">${KANA[i]||"・"}　${x.heading?esc(x.heading)+"について<br>":""}${esc(citeSentence({...x, no:lbl.no}, lbl.docLabel+lbl.no, same))}${x.judgement?esc(x.judgement):""}</div>`; }).join(""); };
  const sec = (num, title, o, extra="") => `<div class="sec"><div>${num}　${title}</div>${extra}
    ${["s1","s2","s3"].map((s,i)=>`<div style="padding-left:1em">${MARU[i+1]}　${M.subSections[s]}</div>${o[s].cits.length?citeBlock(o[s].cits):'<div class="it">（記載なし）</div>'}`).join("")}
    <div style="padding-left:1em">⑷　結論</div><div class="it">${esc(o.conclusion||"")}</div></div>`;
  const f = d.final;
  return `<div class="paper">
   <div>火災番号　${esc(c.fireNumber)}</div><h1>火災原因判定書</h1>
   <p>火災番号${esc(c.fireNumber)}の火災について、次のとおり判定した。</p>
   <div class="right">${esc(d.docDate?fmtDate(d.docDate+"T00:00:00"):"")}</div>
   <div class="right">所属　${esc(author?.dept||"")}<br>階級・氏名　${esc(author?[author.rank,author.name].filter(Boolean).join("　"):"")}</div>
   ${d.bldg.omit ? "" : sec("１","出火建物の判定", d.bldg)}
   ${sec(d.bldg.omit?"１":"２","出火箇所の判定", d.origin)}
   <div class="sec"><div>${d.bldg.omit?"２":"３"}　出火原因の判定</div>
    ${d.sources.length?`<div class="it">出火箇所に存在する火源として、${d.sources.map((s,i)=>`${KANA[i]}　${esc(s.name)}`).join("、")}が考えられるので、以下検討する。</div>`:""}
    ${d.sources.map((s,i)=>`<div style="padding-left:1em">${MARU[i+1]}　${esc(s.name)}について</div>${citeBlock(s.cits)}<div class="it">${KANA[s.cits.length]||"・"}　結論<br>${esc(s.consideration||"")}</div>`).join("")}
    <div style="padding-left:1em">${MARU[d.sources.length+1]}　結論</div><div class="it">${esc(f.text||"")}</div>
    ${f.certainty==="不明とする" && f.unknownReason ? `<div class="it">${esc(f.unknownReason)}</div>` : ""}</div>
   <div class="sec"><div>${d.bldg.omit?"３":"４"}　その他</div>
    <div style="padding-left:1em">⑴　保険加入の状況</div><div class="it">${esc(d.other.insurance||"")}</div>
    <div style="padding-left:1em">⑵　その他の資料</div><div class="it">${esc(d.other.materials||"")}</div></div>
  </div>`;
}

    try { await save("causeDocs", d, "新規作成"); } catch(e){ return view(`<div class="card">作成に失敗しました：${esc(e.message)}</div>`); }
  }
  const [staff, locs, srcs, revs] = await Promise.all([getAllS("staff"), byIndex("locations","caseId",id), citableRecords(id), byIndex("revisions","docId",d.id)]);
  const lstaff = live(staff), llocs = live(locs);
  const srcMap = new Map(srcs.map(s=>[s.id,s]));
  const locked = d.status==="確定"; const dis = locked?"disabled":"";
  const checks = checkCause(d, srcMap, llocs);
  const inp = (path, ph="", rows=0) => rows ? `<textarea data-path="${path}" placeholder="${esc(ph)}" style="min-height:${rows*24}px" ${dis}>${esc(getPath(d,path)||"")}</textarea>` : `<input data-path="${path}" value="${esc(getPath(d,path)||"")}" placeholder="${esc(ph)}" ${dis}>`;
  const citeCard = (x, target, idx) => {

  <div class="card row">${locked?`<button class="pri" id="c_correct">訂正を開始</button>`:`<button class="pri" id="c_confirm">判定書を確定</button>`}</div>
  <div class="card"><h3>版の履歴</h3>${live(revs).sort((a,b)=>a.version-b.version).map(v=>`第${v.version}版　${esc(fmtDTshort(v.at))}　${v.reason?"訂正理由："+esc(v.reason):"初回確定"}　<a href="#/case/${id}/cause/preview?v=${v.version}">表示</a>`).join("<br>") || '<span class="muted">確定された版はありません。</span>'}</div>`);

  if (locked){
    $("#c_correct").onclick = async ()=>{ const r = await askReason("訂正理由を入力してください（確定済みの版はそのまま保存されます）"); if (!r) return;

    return;
  }
  // 入力値を文書に反映

  let dirty = false; leaveGuard = () => dirty;
  const persist = async (action, reason="") => { try { await save("causeDocs", d, action, reason); dirty = false; return true; } catch(e){ toast("保存に失敗しました："+e.message, true); return false; } };
  $$("[data-path]").forEach(el=>el.addEventListener(el.tagName==="SELECT"||el.type==="checkbox"?"change":"input", ()=>{ dirty = true; $("#dirty").textContent="未保存の変更があります"; }));

  $$("[data-srcup]").forEach(b=>b.onclick=()=>moveSrc(b.dataset.srcup,-1));
  $$("[data-srcdown]").forEach(b=>b.onclick=()=>moveSrc(b.dataset.srcdown,1));
  $$("[data-srcdel]").forEach(b=>b.onclick=async ()=>{ const s = d.sources.find(x=>x.id===b.dataset.srcdel); const r = await askReason(`火源「${s.name}」を検討対象から外します。理由を入力してください（履歴に残ります）`); if (!r) return;
    collect(); d.sources = d.sources.filter(x=>x.id!==s.id); if (d.final.sourceId===s.id) d.final.sourceId=""; if (await persist("火源を外す", r)) router(); });
  $$("[data-uncite]").forEach(b=>b.onclick=async ()=>{ const [t, cid] = b.dataset.uncite.split("|"); const ok = await askConfirm("この引用を外します。よろしいですか？（変更履歴に残ります）","外す"); if (!ok) return;
    collect(); const l = citeList(d,t); l.splice(l.findIndex(x=>x.id===cid),1); if (await persist("引用を外す")) router(); });

  $("#cp_src").onchange = showOrig;
  $("#cp_method").onchange = ()=>{ $("#cp_verwrap").style.display = val("cp_method")==="要約" ? "" : "none"; showOrig(); };
  $$("[data-cite]").forEach(b=>b.onclick=()=>{ $("#cp_target").value=b.dataset.cite; const t=b.dataset.cite; $("#cpTitle").textContent = "引用を追加："+(t.startsWith("src:")?`火源「${d.sources.find(s=>s.id===t.slice(4))?.name}」`:`${t.startsWith("bldg")?"1 出火建物":"2 出火箇所"} ${M.subSections[t.split(".")[1]]}`);
    ["cp_src","cp_quote","cp_judge","cp_head"].forEach(i=>$("#"+i).value=""); $("#cp_method").value="原文"; $("#cp_dir").value = t.startsWith("src:") ? "否定" : "肯定"; $("#cp_ver").checked=false; $("#cp_orig").textContent=""; $("#cp_verwrap").style.display="none";

    if (method==="原文" && quote!==s.text) return toast("「原文」の引用は記録の内容と完全に一致させてください。一部だけなら「抜粋」を選んでください", true);
    if (method==="抜粋" && !s.text.replace(/\s/g,"").includes(quote.replace(/\s/g,""))) return toast("抜粋が原文の中に見つかりません。原文の一部をそのまま使ってください", true);
    if (method==="要約" && !$("#cp_ver").checked) return toast("要約は原文と照合したことを確認してください", true);

      method, quote, verified: method==="要約" ? true : false, direction:val("cp_dir"), heading:val("cp_head"), judgement:$("#cp_judge").value.trim(), citedAt:nowISO()});
    if (await persist("引用を追加")){ toast("引用を追加しました"); router(); }
  };
  $("#tmpl").onclick = ()=>{ collect(); const f=d.final; const s=d.sources.find(x=>x.id===f.sourceId);
    if (!f.certainty) return toast("先に判定の区分を選んでください", true);

    collect(); const ck = checkCause(d, srcMap, llocs); const l1 = ck.filter(x=>x.lv===1);

    const version = (d.version||0)+1;

        t.objectStore("audit").put({id:uuid(), caseId:id, store:"causeDocs", targetId:d.id, action:`確定（第${version}版）`, reason:note, before, after:nd, at:ts}); });
      dirty = false; toast(`第${version}版として確定しました`); router(); } catch(e){ toast("確定に失敗しました："+e.message, true); }
  };
});

route("/case/:id/cause/preview(?:\\?v=(?<v>\\d+))?", async ({id, v})=>{
  let c, d, staff, labelOf, verLabel = "";
  if (v){
    const d0 = live(await byIndex("causeDocs","caseId",id))[0];
    const rv = d0 && (await byIndex("revisions","docId",d0.id)).find(x=>String(x.version)===v);
    if (!rv) return view("版が見つかりません");
    ({doc:d, case:c, staff} = rv.snapshot); labelOf = x => rv.snapshot.labels[x.id] || {docLabel:x.docLabel, no:x.no}; verLabel = `確定版（第${v}版）`;
  } else {
    c = await getOne("cases", id); d = live(await byIndex("causeDocs","caseId",id))[0]; staff = await getAllS("staff");
    if (!d) return view(`<div class="card">判定書がまだありません。<a href="#/case/${id}/cause">作成する</a></div>`);
    const srcMap = new Map((await citableRecords(id)).map(s=>[s.id,s]));
    labelOf = x => { const s = srcMap.get(x.sourceId); return s ? {docLabel:s.docLabel, no:s.no} : {docLabel:x.docLabel, no:x.no}; };
    if (d.status==="確定") verLabel = `確定版（第${d.version}版）`;
  }

});

/* =========================================================
   様式1：火災調査書（その1 基本情報／その2 文章欄／その3 防火管理等）

   ========================================================= */
M.burnDegrees = ["全焼","半焼","部分焼","ぼや"];

function newReportDoc(caseId, authorStaffId){
  return {id:uuid(), caseId, status:"作成中", version:0, docDate:new Date().toISOString().slice(0,10), authorStaffId:authorStaffId||"",
    site:{officeFloor:"", business:"", ordinanceUse:"", buildingArea:"", totalFloorArea:""},
    origin:{kind:"", personId:""},
    damage:{degree:"", floorArea:"", surfaceArea:"", b:{全焼:"",半焼:"",部分焼:"",ぼや:""}, households:"", victims:"", dead:"", injured:"", amount:""},

}
const bldgTotal = d => ["全焼","半焼","部分焼","ぼや"].reduce((a,k)=>a+(Number(d.damage.b[k])||0),0);
function dtJ(iso, prec){ if (!iso) return ""; const t=new Date(iso); if (isNaN(t)) return ""; return `${wareki(t)}${t.getMonth()+1}月${t.getDate()}日 ${t.getHours()}時${t.getMinutes()}分${prec==="頃"?"頃":""}`; }

/* 様式2の結果（確定版のみを反映する。作成中・訂正中の内容は反映しない）【仕様書8／項目定義表 様式1】 */
async function causeResult(caseId){
  const d = live(await byIndex("causeDocs","caseId",caseId))[0];
  if (!d) return {confirmed:false, status:"未作成"};
  const revs = live(await byIndex("revisions","docId",d.id)).sort((a,b)=>b.version-a.version);
  if (!revs.length) return {confirmed:false, status:d.status};
  const sd = revs[0].snapshot.doc; const locs = live(await byIndex("locations","caseId",caseId));
  const f = sd.final; const unknown = f.certainty==="不明とする";
  return {confirmed:true, version:revs[0].version, correcting:d.status!=="確定", certainty:f.certainty,
    origin: sd.origin.rangeText || (sd.origin.locationId ? locPath(locs, sd.origin.locationId) : ""),
    source: unknown ? "不明" : (sd.sources.find(s=>s.id===f.sourceId)?.name || ""),
    process: unknown ? "不明" : (f.process||""), firstIgnited: unknown ? "不明" : (f.firstIgnited||""),
    text: f.text||"", unknownReason: f.unknownReason||""};
}
const personLine = (p, role) => p ? `${role}　${[p.job, p.name].filter(Boolean).join("　")}${p.age||p.sex?`（${[p.age?p.age+"歳":"", p.sex||""].filter(Boolean).join("・")}）`:""}` : "";

function checkReport(d, c, cause, persons, docs4, agg){
  const ck = []; const add=(lv,msg,src)=>ck.push({lv,msg,src});
  if (!d.authorStaffId) add(1,"作成者が未設定です。","様式1");
  if (!d.text.damage) add(1,"り災概要が未入力です。","第2章第2節■1");
  if (!d.text.cause) add(1,"出火原因概要が未入力です。","第2章第2節■1");
  if (!cause.confirmed) add(1,`原因欄は様式2（火災原因判定書）の確定後に反映されます（様式2：${cause.status}）。`,"項目定義表 様式1");
  else if (cause.correcting) add(2,`様式2は訂正中です。原因欄には確定済みの第${cause.version}版を表示しています。`);
  if (cause.confirmed){
    const words = {"判定する":"判定する","推定する":"推定する","不明とする":"不明とする"};
    for (const [w,t] of [["出火原因概要",d.text.cause],["原因判定理由",d.text.reason]]){
      for (const k of Object.keys(words)) if (k!==cause.certainty && (t||"").includes(k)) add(2,`${w}に「${k}」とありますが、様式2の判定の区分は「${cause.certainty}」です。`,"様式2との整合");
    }
  }
  if (/[0-9０-９]+\s*時/.test(d.text.cause||"") && !d.text.timeBasis) add(2,"出火原因概要に時刻があります。時刻を記載するには明確な根拠が必要です。根拠（記録）を「時刻の根拠」欄に記入してください。","第2章第2節■1 注意");
  timeOrderWarn(c).forEach(w=>add(2,w,"案件の時刻"));
  if (c.fireType==="建物"){
    if (!d.origin.personId) add(2,"火元（関係者）が選ばれていません。","様式1その1");
    if (!d.damage.degree) add(2,"焼損程度が未選択です。","様式1その1");
    else if (!(Number(d.damage.b[d.damage.degree])>0)) add(2,`焼損程度が「${d.damage.degree}」ですが、焼損棟数の「${d.damage.degree}」が0棟です。`,"様式1その1");
  }
  if (!d.text.discovery) add(3,"発見状況が未入力です。","第2章第2節■2");
  if (!d.text.report) add(3,"通報状況が未入力です。","第2章第2節■3");
  if (!d.text.initial) add(3,"初期消火状況が未入力です（実施していない場合はその旨を記載）。","第2章第2節■4");
  const unconf = docs4.filter(x=>x.status!=="確定"); if (unconf.length) add(3,`未確定の実況（鑑識）見分調査書が${unconf.length}件あります。`);
  // 様式6・7の集計（確定版）との不一致【仕様書11-2】
  if (agg){ const diff = [];
    if (agg.count){ for (const [k,lab,av] of [["amount","損害額",agg.amount],["floorArea","焼損床面積",agg.floorArea],["surfaceArea","焼損表面積",agg.surfaceArea],["households","り災世帯",agg.households],["victims","り災人員",agg.victims]]) if (num(d.damage[k])!==av) diff.push(`${lab}（様式1：${d.damage[k]||0}／様式6：${av}）`);
      for (const k of M.burnDegrees) if (num(d.damage.b[k])!==agg.b[k]) diff.push(`焼損棟数${k}（様式1：${d.damage.b[k]||0}／様式6：${agg.b[k]}）`); }
    if (agg.casCount){ if (num(d.damage.dead)!==agg.dead) diff.push(`死者（様式1：${d.damage.dead||0}／様式7：${agg.dead}）`); if (num(d.damage.injured)!==agg.injured) diff.push(`傷者（様式1：${d.damage.injured||0}／様式7：${agg.injured}）`); }
    if (diff.length) add(2,`様式6・7の集計（確定版）と一致しない項目があります：${diff.join("、")}。「集計値を反映」で写せます。`,"仕様書11-2");
    if (agg.draft) add(3,`未確定の損害調査書が${agg.draft}件あります（集計に含めていません）。`);
    if (agg.casDraft) add(3,`未確定の死傷者の調査書が${agg.casDraft}件あります（集計に含めていません）。`); }
  return ck;
}

route("/case/:id/report/preview(?:\\?v=(?<v>\\d+))?", async ({id, v})=>{
  let c, d, staff, person, cause, verLabel = "";
  if (v){
    const d0 = live(await byIndex("reportDocs","caseId",id))[0];
    const rv = d0 && (await byIndex("revisions","docId",d0.id)).find(x=>String(x.version)===v);
    if (!rv) return view("版が見つかりません");
    ({doc:d, case:c, staff, person, cause} = rv.snapshot); verLabel = `確定版（第${v}版）`;
  } else {
    c = await getOne("cases", id); d = live(await byIndex("reportDocs","caseId",id))[0];
    if (!d) return view(`<div class="card">火災調査書がまだありません。<a href="#/case/${id}/report">作成する</a></div>`);
    staff = await getAllS("staff"); person = d.origin.personId ? await getOne("persons", d.origin.personId) : null; cause = await causeResult(id);
    if (d.status==="確定"){ const rv = live(await byIndex("revisions","docId",d.id)).sort((a,b)=>b.version-a.version)[0]; if (rv) ({doc:d, case:c, staff, person, cause} = rv.snapshot); verLabel = `確定版（第${d.version}版）`; }
  }
  view(`<div class="noprint row" style="margin-bottom:8px"><a class="btn sm" href="#/case/${id}/report">← 編集画面</a><button class="pri sm" onclick="printPaper()">印刷・PDF保存</button></div>
   ${verLabel?`<div class="right" style="font-family:sans-serif;font-size:12px">${esc(verLabel)}</div>`:`<div class="right"><span class="draftmark">下書き（未確定）</span></div>`}
   ${renderReportPaper(c, d, staff, person, cause)}
   <p class="muted noprint">※確定版は確定時点の案件情報・関係者・原因（様式2）を表示します。文章欄は入力された文言をそのまま出力しています（AIによる追加・変更はありません）。様式・区分コードは所属消防本部の様式・火災報告取扱要領と照合して確定します。【要確認】</p>`);
});

M.ivGuide = {
  "出火行為者":["火源・着火物の構造・設備・種類・型式・形状・容量・材質・位置","火源の使用状況・経歴・目的・時間・回数・方法","整備・点検・調整・掃除の状況","故障・修理・破損・構造不完全・腐食の状況","購入年月日・購入先・製造元","周囲の可燃物との距離","火炎の飛散距離・範囲","外出・出勤・退社等の時間、火元の場所を離れた時間","出火時及びその後の行動","現場付近の人の存在","動物の介在、使用取扱者の変更、建物の構造・設備・物品の配置"],
  "火元関係者等":["建物の構造・設備・増改築・物品の配置","事業内容・規模・経営状況・従業員数・出退勤や外出の時間","居住者・生活状況・行動や外出の時間経過","作業内容、火気設備の位置と管理","施設・設備の取扱い・巡回・点検・故障と修理","火気取扱者と使用時間","出入口・開口部と施錠","消防用設備の設置・作動","火災保険の加入状況","過去の不審者・侵入者・盗難等の有無"],
  "発見者":["発見の動機（炎・煙・熱気・音・臭気・人声・動物の鳴声等）","発見者の位置（建物内外の別・方向・距離・高低差）","視認状況（視認の難易、誤認の要因となる障害物）","時刻（テレビ・ラジオ・時計等の手がかり）","燃焼状況（位置・範囲・炎・煙の色・燃焼物）","発見後の行動","他人の行動・性別・推定年齢・服装","図面を使って質問する"],
  "初期消火者":["火災を聞知した状況・位置・動機","聞知した位置から消火位置までの経路・所要時間","燃焼状況（火煙の位置・範囲・量、何が燃えていたか）","消火方法（用具の種類・位置、回数・時間）","他人の行動等"],
  "通報者":["火災を聞知した状況・位置・理由","聞知した位置から通報した位置までの経路・所要時間","通報方法・通報を依頼された相手・通報の手段"],
  "被救出者・負傷者":["避難方法、受傷原因、受傷状況など（死傷者の調査書（様式7）の項目）"],
  "その他の関係者等":["製品の不具合が疑われる場合の製造業者など","任意の質問で必要な情報が得られない場合は、資料提出命令・報告徴収（様式8・9）を検討"]
};
function ivGuideKeys(roles){
  const k = new Set();
  for (const r of roles||[]){
    if (r==="出火行為者") k.add("出火行為者");
    else if (r.startsWith("火元関係者")) k.add("火元関係者等");
    else if (["発見者","通報者","初期消火者"].includes(r)) k.add(r);
    else if (["被救出者","負傷者"].includes(r)) k.add("被救出者・負傷者");
    else if (!["立会人","通訳者","死者"].includes(r)) k.add("その他の関係者等");
  }
  return [...k];
}
function newInterview(caseId, person, round, authorStaffId){
  const sections = {}; M.ivSections.forEach(([k])=>sections[k]=[]);
  return {id:uuid(), caseId, personId:person.id, round, title:"質問調査書", status:"作成中", version:0, docDate:new Date().toISOString().slice(0,10), authorStaffId:authorStaffId||"",
    at:"", atPrec:"頃", place:"", method:"", methodOther:"", witnessId:"", witnessRel:"", interpreterId:"", aids:{}, sections, attachNote:"",
    confirm:{method:"", result:"", denied:"", changes:""}};
}
/* 引用・書類で使う申述者の呼び方：例「発見者鈴木花子（30歳）の質問調査書（第1回）」【マニュアル準拠（第3章第2節 記載例）】 */
function ivLabel(iv, p){
  const role = (p?.roles||[]).find(r=>!["立会人","通訳者"].includes(r)) || "";
  return `${role.replace(/（.*）/,"")}${p?.name||"（申述者未設定）"}${p?.age?`（${p.age}歳）`:""}の${iv.title}（第${iv.round}回）`;
}
function ivConfirmText(iv, persons){
  const c = iv.confirm||{}; if (!c.method || c.method==="確認していない" || !c.result) return "";
  const pn = id => persons.find(p=>p.id===id)?.name || "〔氏名〕";
  const head = {"読み聞かせ":"上記のとおり記録した内容を読み聞かせ、",
    "通訳者を介して読み聞かせ":`上記のとおり記録した内容を通訳者（${pn(iv.interpreterId)}）を介して読み聞かせ、`,
    "立会人に対して読み聞かせ":`上記のとおり記録した内容を立会人（${pn(iv.witnessId)}${iv.witnessRel?`（${iv.witnessRel}）`:""}）に対して読み聞かせ、`,
    "メールにより送付":"上記のとおり記録した内容をメールにより送付し、"}[c.method] || "";
  const lines = s => (s||"").split("\n").map(x=>x.trim()).filter(Boolean);
  if (c.result==="誤りがないことを確認した") return head+"誤りがないことを確認した。";
  if (c.result==="一部を否定した") return head+"確認を行ったが、申述者は以下の内容について否定した。\n"+lines(c.denied).map(x=>"・"+x).join("\n");
  return head+"確認を行ったところ、次のとおり変更の申し入れがあった。\n"+lines(c.changes).map((x,i)=>`${i+1}　${x}`).join("\n");
}
function checkInterview(iv, c, person, persons, sameIvs){
  const ck = []; const add=(lv,msg,src)=>ck.push({lv,msg,src});
  if (!iv.personId || !person) add(1,"申述者が設定されていません。","様式5");
  if (!iv.authorStaffId) add(1,"作成者（聴取者）が未設定です。","第6章第2節");
  if (!iv.at) add(1,"聴取日時が未入力です。","様式5");
  if (!iv.method) add(1,"聴取方法が未選択です。","様式5");
  if (iv.method==="その他" && !iv.methodOther) add(2,"聴取方法「その他」の内容が未入力です。","様式5");
  const paras = M.ivSections.flatMap(([k,no])=>(iv.sections[k]||[]).map(p=>({no, text:p.text||""}))).filter(p=>p.text.trim());
  if (!paras.length) add(1,"申述内容が入力されていません。","様式5");
  if (!iv.confirm?.method) add(1,"聴取した内容の確認（読み聞かせ等）の結果が未記録です。","第6章第3節■1");
  else if (iv.confirm.method==="確認していない") add(2,"申述内容を申述者に確認していません。読み聞かせ等で確認することが望ましいとされています。","第6章第3節■1");
  else {
    if (!iv.confirm.result) add(1,"確認の結果が未選択です。","第6章第3節■1");
    if (iv.confirm.result==="一部を否定した" && !iv.confirm.denied) add(1,"否定された内容が未入力です。","第6章第3節■1 記載例4");
    if (iv.confirm.result==="変更の申し入れがあった" && !iv.confirm.changes) add(1,"変更の申し入れの内容が未入力です。","第6章第3節■1 記載例5");
    if (iv.confirm.method==="通訳者を介して読み聞かせ" && !iv.interpreterId) add(1,"通訳者が設定されていません。");
    if (iv.confirm.method==="立会人に対して読み聞かせ" && !iv.witnessId) add(1,"立会人が設定されていません。");
  }
  if (person && Number(person.age)>0 && Number(person.age)<18 && !iv.witnessId) add(2,"申述者が18歳未満です。保護者等の立会いを求めるよう努めます（支障がないと認められる場合等を除く）。","第6章第3節■1⑶");
  for (const p of paras){
    if (/[（(][^）)]*[）)]/.test(p.text)) add(2,`${p.no}：括弧書きがあります。作成者による補足説明は信用性を損なうおそれがあります（申述者自身の言葉であれば問題ありません）。`,"第6章第3節■1⑵");
    if (/\d+\s*秒|[0-9]+\.[0-9]+|[０-９]+．[０-９]+/.test(p.text)) add(3,`${p.no}：一般には分からないような細かな数値がないか確認してください。`,"第6章第3節■1⑵");
    if (/から聞い|と聞い|らしい|そうです|だそうだ/.test(p.text)) add(3,`${p.no}：他人から聞いた情報の可能性があります。申述者自身が体験したことか確認してください。【独自提案】`,"第6章第3節■2");
  }
  const authors = new Set(sameIvs.map(x=>x.authorStaffId).filter(Boolean));
  if (authors.size>1) add(2,"同じ申述者への質問で、回によって作成者（調査員）が変わっています。信用性が損なわれるおそれがあるため注意してください。","第6章第3節■1⑵");
  if (iv.at && c.occurrenceAt){ const days = (new Date(iv.at)-new Date(c.occurrenceAt))/864e5; if (days>30) add(3,`出火から${Math.floor(days)}日後の聴取です。記憶が薄れていないか、他の資料と比較検討してください。【独自提案：30日を目安】`,"第6章第3節■1⑵・■4"); }
  if ((iv.corrections||[]).some(x=>x.type!=="申述者の申出による訂正")) add(2,"確定（確認）後に、申述者の申出によらない訂正があります。読み聞かせ後の書き換えは信用性が損なわれるおそれがあります。","第6章第3節■1⑵");
  return ck;
}
function renderIvPaper(c, iv, staff, persons, photos=[]){
  const author = staff.find(s=>s.id===iv.authorStaffId); const p = persons.find(x=>x.id===iv.personId);
  const pn = id => persons.find(x=>x.id===id);
  const box = (list, sel) => list.map(x=>`${x===sel?"■":"□"}${esc(x)}`).join("　");
  const conf = ivConfirmText(iv, persons);
  // 記載のある項目だけを、様式5の項目順で出力する（3の小項目があれば「3. 主な申述内容」の見出しを付ける）
  let s3head = false; const body = M.ivSections.filter(([k])=>(iv.sections[k]||[]).some(x=>(x.text||"").trim())).map(([k,no,title])=>{
    const sub = no.startsWith("3"); const head = sub && !s3head ? (s3head = true, '<div class="sec"><div>3.　主な申述内容</div></div>') : "";
    return `${head}<div class="sec"><div>${sub ? "　"+esc(no.slice(1)) : esc(no)+"."}　${esc(title)}</div>
     ${iv.sections[k].filter(x=>(x.text||"").trim()).map(x=>`<div style="white-space:pre-wrap;padding-left:1em;text-indent:1em">${esc(x.text)}</div>`).join("")}</div>`; }).join("");
  return `<div class="paper">
   <div class="right">火災番号　${esc(c.fireNumber)}</div><h1>${esc(iv.title)}（第${iv.round}回）</h1>
   <p>火災番号${esc(c.fireNumber)}の火災について、下記の者に質問したところ任意に、次のとおり申述した。</p>
   <div class="right">${esc(iv.docDate?fmtDate(iv.docDate+"T00:00:00"):"")}<br>所属　${esc(author?.dept||"")}<br>階級・氏名　${esc(author?[author.rank,author.name].filter(Boolean).join("　"):"")}</div>
   <table class="hd" style="width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;overflow-wrap:anywhere">
    <tr><th style="width:22%;text-align:left" rowspan="2">申述者</th><td>住所（連絡先）　${esc([p?.addr, p?.tel].filter(Boolean).join("（")+(p?.addr&&p?.tel?"）":""))}</td></tr>
    <tr><td>氏名　${esc(p?.name||"")}${p?.age?`（${esc(p.age)}歳）`:""}</td></tr>
    <tr><th style="text-align:left">聴取日時</th><td>${esc(dtJ(iv.at, iv.atPrec))}${iv.place?`　場所：${esc(iv.place)}`:""}</td></tr>
    <tr><th style="text-align:left">聴取方法</th><td>${box(M.ivMethods.slice(0,3), iv.method)}　${iv.method==="その他"?"■":"□"}その他（${esc(iv.method==="その他"?iv.methodOther:"")}）</td></tr>
    ${iv.witnessId?`<tr><th style="text-align:left">立会人</th><td>${esc(pn(iv.witnessId)?.name||"")}${iv.witnessRel?`（${esc(iv.witnessRel)}）`:""}</td></tr>`:""}
    ${iv.interpreterId?`<tr><th style="text-align:left">通訳者</th><td>${esc(pn(iv.interpreterId)?.name||"")}</td></tr>`:""}
    ${Object.values(iv.aids||{}).some(Boolean)?`<tr><th style="text-align:left">筆談等</th><td>${esc(M.ivAids.filter(a=>iv.aids[a]).join("・"))}</td></tr>`:""}
   </table>
   ${body}
   ${(()=>{ const ph = (iv.photoIds||[]).map(id=>(photos||[]).find(p=>p.id===id)).filter(Boolean); return ph.length||iv.attachNote ? `<div class="sec"><div>4.　申述者が作成した図面等</div>${ph.map(p=>`<div style="padding-left:1em">・${esc(caption(p))}（添付）</div>`).join("")}${iv.attachNote?`<div style="white-space:pre-wrap;padding-left:1em">・${esc(iv.attachNote)}（添付）</div>`:""}</div>` : ""; })()}
   ${conf?`<div class="sec" style="white-space:pre-wrap;padding-left:1em;text-indent:1em">${esc(conf)}</div>`:""}
  </div>`;
}

route("/case/:id/iv/new", async ({id})=>{
  const c = await getOne("cases", id); const ps = live(await byIndex("persons","caseId",id));
  const ivs = live(await byIndex("interviews","caseId",id));
  view(`<a class="btn sm" href="#/case/${id}">← 案件ホーム</a><h1>質問調査書を作成 <small class="muted">${esc(c.fireNumber)}</small></h1>
   <div class="card"><p class="muted">申述者は関係者の画面に登録した人から選びます。同じ人への2回目以降の聴取は、新しい回として作成します。【項目定義表 様式5】</p>
   ${field("申述者",`<select id="iv_p">${optObj(ps.filter(p=>!(p.roles||[]).every(r=>r==="立会人"||r==="通訳者")||!(p.roles||[]).length),"",p=>`${p.name}${(p.roles||[]).length?"（"+p.roles.join("・")+"）":""}　既存${ivs.filter(x=>x.personId===p.id).length}回`)}</select>`,true)}
   ${ps.length?"":`<p class="muted">関係者が登録されていません。<a href="#/case/${id}/persons">関係者を登録</a></p>`}
   <button class="pri" id="iv_create">作成</button></div>`);
  $("#iv_create").onclick = async ()=>{
    const p = ps.find(x=>x.id===val("iv_p")); if (!p) return toast("申述者を選んでください", true);
    const round = (await byIndex("interviews","caseId",id)).filter(x=>x.personId===p.id).length + 1; // 無効化した回も数える（番号を再利用しない）
    const iv = newInterview(id, p, round, c.leadStaffId);
    try { await save("interviews", iv, "新規作成"); go(`#/case/${id}/iv/${iv.id}`); } catch(e){ toast("作成に失敗しました："+e.message, true); }
  };
});

route("/case/:cid/iv/:iid", async ({cid, iid})=>{
  const c = await getOne("cases", cid); const iv = await getOne("interviews", iid);
  if (!iv || iv.deleted) return view(`<div class="card">質問調査書が見つかりません。<a href="#/case/${cid}">案件ホームへ</a></div>`);
  const [staff, persons, revs, all, photos] = await Promise.all([getAllS("staff"), byIndex("persons","caseId",cid), byIndex("revisions","docId",iid), byIndex("interviews","caseId",cid), byIndex("photos","caseId",cid)]);
  const lph = live(photos).sort((a,b)=>a.number-b.number);
  const lstaff = live(staff), lpers = live(persons); const person = lpers.find(p=>p.id===iv.personId);
  const sameIvs = live(all).filter(x=>x.personId===iv.personId);
  const locked = iv.status==="確定"; const dis = locked?"disabled":"";
  const checks = checkInterview(iv, c, person, lpers, sameIvs);
  const inp = (path, ph="", rows=0, type="text") => rows ? `<textarea data-path="${path}" placeholder="${esc(ph)}" style="min-height:${rows*24}px" ${dis}>${esc(getPath(iv,path)||"")}</textarea>` : `<input type="${type}" data-path="${path}" value="${esc(getPath(iv,path)||"")}" placeholder="${esc(ph)}" ${dis}>`;
  const gk = ivGuideKeys(person?.roles);
  const cited = new Set(); for (const d of live(await byIndex("causeDocs","caseId",cid))) for (const {c:x} of allCits(d)) cited.add(x.sourceId);
  view(`<a class="btn sm" href="#/case/${cid}">← 案件ホーム</a>
  <div class="row"><h1 style="margin-right:auto">様式5 ${esc(ivLabel(iv, person))}</h1><a class="btn pri" href="#/case/${cid}/iv/${iid}/preview">書類プレビュー</a></div>
  <div class="card" style="border-color:#c9a227"><b>申述は「申述」として記録します。</b><span class="muted">見分事実には変換しません。要点を記録する場合も意味や表現を変えず、方言や独特の言い回しはそのまま残します。作成者による括弧書きの補足はしません。【マニュアル準拠（第6章第3節■5）】</span></div>
  ${locked?`<div class="lock">確定済み（第${iv.version}版・${esc(fmtDTshort(iv.confirmedAt))}）。確定後の変更は、原則として申述者の申出による訂正として記録します。</div>`:""}
  ${iv.status==="訂正中"?`<div class="lock">訂正中（${esc(iv.correctionType||"")}：${esc(iv.correctionReason)}）。再度「確定」すると新しい版になります。</div>`:""}
  <div class="card"><div class="grid">
   ${field("様式の名称",`<select data-path="title" ${dis}>${opt(M.ivTitles,iv.title)}</select>`)}
   ${field("作成者（聴取者）",`<select data-path="authorStaffId" ${dis}>${optObj(lstaff,iv.authorStaffId,staffLabel)}</select>`,true)}
   ${field("作成日",inp("docDate","","","date"))}
   ${field("申述者",`<div style="padding:9px 0">${esc(person?`${person.name}（${(person.roles||[]).join("・")}）`:"未設定")}　<a href="#/case/${cid}/persons">関係者の画面で編集</a></div>`)}
   ${field("聴取日時",`<input type="datetime-local" data-path="at" value="${esc(localInput(iv.at))}" ${dis}>`,true)}
   ${field("聴取日時の確度",`<select data-path="atPrec" ${dis}>${opt(M.timePrecision,iv.atPrec||"頃")}</select>`)}
   ${field("聴取場所",inp("place","例：申述者宅の居間（第三者のいない場所）"))}
   ${field("聴取方法",`<select data-path="method" ${dis}>${opt([""].concat(M.ivMethods),iv.method)}</select>`,true)}
   ${field("「その他」の内容",inp("methodOther","例：Web会議"))}
   ${field("立会人（保護者等）",`<select data-path="witnessId" ${dis}>${optObj(lpers.filter(p=>p.id!==iv.personId),iv.witnessId,p=>p.name)}</select>`)}
   ${field("立会人の続柄等",inp("witnessRel","例：父親"))}
   ${field("通訳者",`<select data-path="interpreterId" ${dis}>${optObj(lpers.filter(p=>p.id!==iv.personId),iv.interpreterId,p=>p.name)}</select>`)}
  </div><div class="row"><span class="muted">筆談等：</span>${M.ivAids.map(a=>`<label style="font-size:14px"><input type="checkbox" data-path="aids.${a}" ${iv.aids?.[a]?"checked":""} ${dis}> ${a}</label>`).join("")}</div></div>
  <details class="card chkcard" ${checks.some(x=>x.lv===1)?"open":""}><summary><h3 style="display:inline">チェック結果（${checks.length}件）</h3><span class="muted">　${chkSum(checks)}</span></summary><p class="muted">修正を強制するものではありません。【仮仕様：3段階表示】</p>
   ${checks.map(x=>`<div class="chk l${x.lv}"><b>${["","要確認","注意","参考"][x.lv]}</b>　${esc(x.msg)} ${x.src?`<span class="tag-src">［${esc(x.src)}］</span>`:""}</div>`).join("") || '<div class="chk l3">指摘はありません。</div>'}</details>
  <details class="card" ${locked?"":"open"}><summary><b>この申述者に確認すべき事項</b>（${esc(gk.join("・")||"区分未設定")}）【マニュアル準拠（第6章第4節）】</summary>
   ${gk.map(k=>`<div style="margin-top:6px"><b>${esc(k)}</b><ul style="margin:4px 0">${M.ivGuide[k].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("") || '<p class="muted">関係者の画面で「火災との関係」を設定すると表示します。</p>'}
   <p class="muted">誘導するような質問は避け、申述者自身が知り・体験したことを聴取します。【マニュアル準拠（第6章第3節■2）】</p></details>

  ${locked?"":`<div class="card row" style="position:sticky;bottom:0;z-index:5"><button class="pri" id="saveAll">入力内容を保存</button><span class="muted" id="dirty"></span></div>`}
  <div class="card row">${locked?`<select id="i_ctype" style="width:auto">${opt(M.ivCorrTypes,M.ivCorrTypes[0])}</select><button class="pri" id="i_correct">訂正を開始</button>`:`<button class="pri" id="i_confirm">質問調査書を確定</button>`}
   ${!locked && !iv.version?`<button class="danger sm" id="i_del">この調書を無効化</button>`:""}</div>
  <div class="card"><h3>版の履歴</h3>${live(revs).sort((a,b)=>a.version-b.version).map(v=>`第${v.version}版　${esc(fmtDTshort(v.at))}　${v.reason?`訂正（${esc(v.snapshot.doc.correctionType||"")}）：${esc(v.reason)}`:"初回確定"}　<a href="#/case/${cid}/iv/${iid}/preview?v=${v.version}">表示</a>`).join("<br>") || '<span class="muted">確定された版はありません。</span>'}</div>`);

  if (locked){
    $("#i_correct").onclick = async ()=>{ const type = val("i_ctype");
      const r = await askReason(type==="申述者の申出による訂正" ? "申述者からの訂正の申出の内容を入力してください（確定済みの版はそのまま保存されます）" : "訂正の理由を入力してください。読み聞かせ後の書き換えは信用性を損なうおそれがあるため、チェックで注意を表示します。"); if (!r) return;
      try { await save("interviews", {...iv, status:"訂正中", correctionType:type, correctionReason:r, corrections:(iv.corrections||[]).concat([{type, reason:r, at:nowISO()}])}, "訂正開始", `${type}：${r}`); router(); } catch(e){ toast(e.message,true); } };
    return;

  const persist = async (action, reason="") => { try { await save("interviews", iv, action, reason); dirty = false; return true; } catch(e){ toast("保存に失敗しました："+e.message, true); return false; } };
  $$("[data-path],[data-photo]").forEach(el=>el.addEventListener(el.tagName==="SELECT"||el.type==="checkbox"?"change":"input", ()=>{ dirty = true; $("#dirty").textContent = "未保存の変更があります"; }));
  // 確認文の表示は入力に合わせてその場で更新する（選択のたびに画面を描き直すと、直後の入力が失われることがあるため）
  const updConf = () => { const tmp = JSON.parse(JSON.stringify(iv)); $$("[data-path]").forEach(el=>{ if (el.dataset.path.startsWith("confirm.") || ["witnessId","witnessRel","interpreterId"].includes(el.dataset.path)) setPath(tmp, el.dataset.path, el.value); });
    $("#confText").textContent = "出力される文：" + (ivConfirmText(tmp, lpers) || "（未設定）"); };
  $$('[data-path^="confirm."],[data-path="witnessId"],[data-path="witnessRel"],[data-path="interpreterId"]').forEach(el=>el.addEventListener(el.tagName==="SELECT"?"change":"input", updConf));
  $("#saveAll").onclick = async ()=>{ collect(); if (await persist("更新")){ toast("保存しました"); router(); } };
  $$("[data-padd]").forEach(b=>b.onclick = async ()=>{ collect(); (iv.sections[b.dataset.padd] ||= []).push({id:uuid(), text:""}); if (await persist("段落を追加")) router(); });
  $$("[data-pdel]").forEach(b=>b.onclick = async ()=>{ const [k,i] = b.dataset.pdel.split("|"); const p = iv.sections[k][Number(i)];
    const ok = await askConfirm(cited.has(p.id) ? "この段落は様式2で引用されています。削除すると様式2に「引用元が見つからない」と表示されます。削除しますか？（変更履歴に残ります）" : "この段落を削除します。よろしいですか？（変更履歴に残ります）","削除する"); if (!ok) return;
    collect(); iv.sections[k].splice(Number(i),1); if (await persist("段落を削除")) router(); });
  $("#i_del")?.addEventListener("click", async ()=>{ const r = await askReason("この質問調査書を無効化します（履歴に残ります）。理由："); if (!r) return; try { await invalidate("interviews", iv, r); dirty = false; go(`#/case/${cid}`); } catch(e){ toast(e.message,true); } });
  $("#i_confirm").onclick = async ()=>{
    collect(); const ck = checkInterview(iv, c, person, lpers, sameIvs); const l1 = ck.filter(x=>x.lv===1);
    let note = "";
    if (l1.length){ note = await askReason(`「要確認」が${l1.length}件残っています。このまま確定する場合は理由を入力してください。`); if (!note) return; }
    else if (!(await askConfirm("質問調査書を確定します。確定後の変更は「訂正」として新しい版になります。よろしいですか？","確定する"))) return;
    const version = (iv.version||0)+1;
    try { await tx(["interviews","revisions","audit"],"readwrite", async t=>{ const ts=nowISO(); const before = await req(t.objectStore("interviews").get(iv.id));
        const nd = {...iv, status:"確定", version, confirmedAt:ts, updatedAt:ts, confirmNote:note, rev:(before?.rev||0)+1};
        t.objectStore("interviews").put(nd);
        t.objectStore("revisions").put({id:uuid(), caseId:cid, docId:iv.id, version, at:ts, reason:iv.correctionReason||"", confirmNote:note, snapshot:{doc:nd, case:c, staff, persons:lpers, photos:lph}});
        t.objectStore("audit").put({id:uuid(), caseId:cid, store:"interviews", targetId:iv.id, action:`確定（第${version}版）`, reason:note, before, after:nd, at:ts}); });
      dirty = false; toast(`第${version}版として確定しました`); router(); } catch(e){ toast("確定に失敗しました："+e.message, true); }
  };
});

route("/case/:cid/iv/:iid/preview(?:\\?v=(?<v>\\d+))?", async ({cid, iid, v})=>{
